  - id: bachelors
    chapter: "III. A Tax on Being Single"
    date: "6 December 1926"
    narration: >
      From Rome came a story that American papers found irresistible. On the sixth of December, Benito Mussolini's government decreed a special tax on bachelors. From the first of January 1927, unmarried Italian men would have to pay it every year, and the more they earned, the more they paid.
      A newspaper in Augusta, Maine, put it this way: Italian bachelors must pay fat tax for dodging wedlock. Unmarried women, the paper noted, were not penalised. The Literary Digest, which collected jokes from newspapers all over the country, printed one from the Houston Post-Dispatch: Mussolini has imposed a bachelor tax. Whether the move is designed to raise revenue, inflict vengeance or exalt justice is not stated, but we are inclined to favor it.
      The idea was to push men into marriage and raise Italy's birth rate. It did not work. In the years that followed, marriage and birth rates in Fascist Italy fell rather than rose.
