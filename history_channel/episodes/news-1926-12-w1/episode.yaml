  What were the newspapers saying in the first week of December 1926? Agatha Christie vanishes, the Hall-Mills murder trial ends with no one guilty, Mussolini taxes bachelors, Coolidge sends his message to Congress, Wilson sails for Europe in 1918, a "serum" against sleeping sickness, and the US premiere of Battleship Potemkin - with the original newspaper pages.
