  - id: hall-mills
    chapter: "II. Not Guilty"
    date: "3 December 1926"
    narration: >
      In New Jersey, the trial of the decade was coming to an end. Four years earlier, in September 1922, the bodies of a clergyman, the Reverend Edward Wheeler Hall, and a singer from his church choir, Eleanor Mills, had been found under a crab apple tree in a field near New Brunswick. The two had been having an affair. Love letters were scattered around the bodies.
      The first investigation led nowhere. Then, in 1926, a newspaper pushed for the case to be reopened, and Hall's widow, Frances, and her two brothers were put on trial at the county courthouse in Somerville.
      The trial began on the third of November and became a sensation. Reporters came from all over the country. On the third of December, the jury gave its verdict. The Washington Evening Star announced the result the next day on its front page: Hall case ended as court quashes all indictments. All the accused had been found not guilty.
      On the same front page, the paper's cartoonist drew a figure of Justice filing the Hall-Mills case into a safe marked Unsolved Mysteries. He was right. A hundred years later, nobody knows who killed Edward Hall and Eleanor Mills.
