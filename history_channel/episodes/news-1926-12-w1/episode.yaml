scenes:
  - id: cold-open
    montage: true
    narration: >
      A writer vanishes into the English night, and her car is found on the edge of a chalk pit. A murder trial that gripped America ends with no one guilty. Mussolini decides that single men should pay a tax for staying single. And a hospital announces a serum against a mysterious sleeping sickness.
      This is what the newspapers were telling their readers in the first week of December, one hundred years ago.
