  - id: christie
    chapter: "I. The Vanishing Novelist"
    date: "3 December 1926"
    narration: >
      On the evening of Friday the third of December 1926, a thirty-six-year-old writer left her home in Sunningdale, in Berkshire, and drove off into the night. Her name was Agatha Christie. She had already published several detective novels, and that year one of them, The Murder of Roger Ackroyd, had made her famous.
      The next morning her car, a Morris Cowley, was found at Newlands Corner in Surrey, abandoned above a chalk quarry, with her clothes and an expired driving licence inside. There was no sign of the driver.
      Earlier that year her mother had died, and in August her husband, Archie, had asked her for a divorce. He had fallen in love with another woman. On the day she disappeared, the two had quarrelled.
      Police feared she had drowned herself in a nearby lake known as the Silent Pool. The search became one of the biggest Britain had ever seen. More than a thousand police officers and fifteen thousand volunteers combed the countryside, and for the first time aeroplanes were used in a civilian search. A newspaper offered a reward of one hundred pounds. Her car was a Morris Cowley, one of the most popular cars in Britain at the time. Sir Arthur Conan Doyle, the creator of Sherlock Holmes, gave one of her gloves to a spirit medium, hoping it would lead him to her.
      The story crossed the Atlantic and reached the front page of The New York Times. A small newspaper in Maine summed up the situation: British sleuths baffled in search for missing novelist. By the end of this week, nobody knew where Agatha Christie was. Next week, we will find out where she was hiding.
