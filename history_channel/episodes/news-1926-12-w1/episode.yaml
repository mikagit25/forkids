  - id: ads
    chapter: "VIII. Prices and Promises"
    date: "December 1926"
    narration: >
      And what was for sale? In the Daily Kennebec Journal, an advertisement asked: Feeling the strain? Overwork and worry tend to overtax the system. The answer, it promised, was Doan's Pills, a diuretic stimulant to the kidneys, for sixty cents. It was a typical patent medicine of the time, with promises that no one had to prove.
      Car makers were selling speed and freedom. Now Whippet driving is the vogue, announced a full-page advertisement for the Whippet, a light car, adding that women preferred to drive it.
      In a New Jersey paper a year later, a butcher offered ham at twenty-five cents a pound and spring lamb at thirty cents.
      And with Christmas coming, the front page of the Evening Star carried a short reminder that every American family knows: shop early.
