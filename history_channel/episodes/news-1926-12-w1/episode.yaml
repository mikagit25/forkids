  - id: coolidge
    chapter: "IV. The President's Message"
    date: "6\u20137 December 1926"
    narration: >
      In Washington, Congress returned for the winter, and President Calvin Coolidge sent it his annual message on the state of the union. Coolidge did not read it aloud. It was delivered in writing and read out by clerks in both houses.
      His message was calm and confident. Wages were rising, he wrote, and the twelve-hour working day was almost entirely unknown. The Milwaukee Leader summed up what it saw as the most important line for its readers in a giant headline: Easy on farm relief, Coolidge. American farmers were struggling, and the president was not planning to help them much.
      On the same front page there was a smaller headline about Prohibition, which had banned alcohol in the United States since 1920: Bottle gift OK, Supreme Court rules.
      Just to the north, Canadians were going the other way. On the first of December, voters in Ontario gave a large majority to candidates who promised government-controlled liquor sales, making Ontario the fourth Canadian province to turn away from Prohibition.
