    chapter: "Next Week"
    narration: >
      That was the first week of December, as the newspapers saw it. Next week: the search for Agatha Christie, a Nobel Prize, and the first recording of Mussolini's voice played on American radio.
      This has been 100 Years Ago, from Archive Tales. Subscribe so you don't miss next week's papers.
