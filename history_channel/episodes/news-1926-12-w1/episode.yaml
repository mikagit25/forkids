  - id: medicine
    chapter: "VI. The Sleeping Sickness"
    date: "4 December 1926"
    narration: >
      Back in Washington, on the fourth of December 1926, the Evening Star carried a hopeful medical story: St. Elizabeth's Hospital had found a serum to combat sleeping sickness.
      This was not the African sleeping sickness carried by the tsetse fly. It was a strange new disease of the brain, called encephalitis lethargica, which had appeared during the First World War and spread around the world. Some patients fell into a deep sleep that lasted for weeks. Others were left frozen, unable to move or speak, for decades. About a million people are thought to have caught it, and hundreds of thousands died.
      The serum announced that week did not become a cure. No cure was ever found. By the end of the 1920s, the epidemic simply faded away, and its cause is still debated. Fifty years later, the neurologist Oliver Sacks described some of its last survivors in his book Awakenings.
