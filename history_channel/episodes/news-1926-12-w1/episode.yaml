  - id: wilson
    chapter: "V. This Week in 1918"
    date: "4 December 1918"
    narration: >
      Eight years earlier, in the same week, the front pages were filled with a different journey. On the fourth of December 1918, less than a month after the end of the First World War, President Woodrow Wilson sailed from New York for France on the liner George Washington, to take part in the peace conference in Paris.
      No American president had ever travelled to Europe while in office. The New-York Tribune reported that homebound troops cheered Wilson out to sea. Nine days later, the ship was escorted into the French port of Brest by ten battleships and twenty-eight destroyers.
      On the same front page was another headline, about the disaster that was still unfolding at home: third of a million dead from influenza.
