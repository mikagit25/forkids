  - id: cinema
    chapter: "VII. A Film from Moscow"
    date: "5 December 1926"
    narration: >
      On Sunday the fifth of December, New Yorkers could see something new at the Biltmore Theatre: a Soviet silent film called Battleship Potemkin, directed by the young Sergei Eisenstein. It told the story of a mutiny on a Russian warship in 1905. Its scene of soldiers firing on a crowd on the Odessa Steps would become one of the most famous sequences in the history of cinema.
      It was the film's American premiere. At different times the film was banned in several countries, including the Soviet Union itself.
