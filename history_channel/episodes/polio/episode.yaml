  - id: legacy
    chapter: "XIII. What Polio Left Behind"
    narration: >
      Polio left behind millions of survivors. The World Health Organization estimated in 2001 that there were between ten and twenty million of them around the world.
      Many grew up in a world that was not built for them. There were no ramps, and few buses or schools that a wheelchair could enter. Children were sent to separate institutions, or carried up and down stairs.
      As they grew older, polio survivors began to demand equal rights. They were often at the front of the disability rights movement in the United States, which won the Rehabilitation Act of 1973 and the Americans with Disabilities Act of 1990.
      Polio also changed medicine. It gave us the March of Dimes model of fundraising, modern rehabilitation therapy, the ventilator and the intensive care unit, and the largest field trial ever held.
    candidates: ["polio survivor wheelchair 1950s", "disability rights protest 1970s", "rehabilitation center polio children", "Shriners hospital polio"]
