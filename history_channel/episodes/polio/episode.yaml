  - id: copenhagen
    chapter: "VII. Copenhagen, 1952"
    date: "1952"
    narration: >
      In the summer of 1952, polio hit Copenhagen. The city's hospital for infectious diseases had just one iron lung and a few other breathing devices. Within weeks it was overwhelmed with paralysed patients, many of them young children. Nine out of ten patients with the worst form of the disease were dying.
      An anaesthetist, Bjørn Ibsen, noticed something. The patients were not only failing to breathe. Their swallowing muscles were paralysed too, and they were drowning in their own saliva. He suggested a different approach: make a small opening in the windpipe, insert a tube, and push air into the lungs directly, by hand, with a rubber bag.
      The first patient saved this way was a twelve-year-old girl, Vivi Ebert. Soon, medical students, and anyone else who could help, worked in shifts, squeezing bags day and night to keep patients alive. The death rate fell from about ninety per cent to forty per cent almost overnight, and to eleven per cent within a month.
      Ibsen went on to build a machine to do the work. It was the beginning of the modern ventilator, and Ibsen's respiratory centre in Copenhagen was the forerunner of today's intensive care units.
