  - id: brooklyn
    chapter: "III. The Summer of 1916"
    date: "1916"
    narration: >
      On Saturday the seventeenth of June 1916, the health authorities of New York announced an epidemic of infantile paralysis in Brooklyn. Most of the first cases were in the old South Brooklyn district, in Italian immigrant neighbourhoods. Within ten days there were more than two hundred cases.
      It became the worst polio epidemic the world had yet seen. That year, the United States recorded more than twenty-seven thousand cases and over seven thousand deaths. More than two thousand people died in New York City alone.
      The city fought back with the only tools it had. The names and addresses of sick children were printed in the newspapers every day. Their homes were marked with placards, and families were quarantined inside. Thousands of people fled the city for the mountains. Cinemas were closed, meetings cancelled, and children were warned to stay away from water fountains, amusement parks, swimming pools and beaches.
      Doctors had no cure. A report on the epidemic listed some of the remedies that were suggested: oxygen given through the legs by positive electricity, baths in almond meal, poultices of mustard and chamomile, radium water and chloride of gold. None of them worked.
      From then on, polio returned almost every summer, somewhere in the country.
    candidates: ["polio quarantine placard 1916", "Brooklyn 1916", "New York Board of Health 1916", "infantile paralysis 1916 newspaper"]
