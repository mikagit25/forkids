  - id: cutter
    chapter: "XI. The Cutter Incident"
    date: "April 1955"
    narration: >
      The triumph was followed almost immediately by a disaster.
      Several companies had been licensed to make the vaccine, and had already produced large stocks. At one of them, Cutter Laboratories in California, some batches contained live poliovirus that had not been properly killed, even though they had passed the required safety tests.
      About a hundred and twenty thousand doses of this vaccine were given to children. Forty thousand developed a mild form of polio. Fifty-six were paralysed, and five died. The virus spread to their families and neighbours, paralysing a hundred and thirteen more people, and killing five.
      Cutter withdrew its vaccine on the twenty-seventh of April. A congressional hearing in June 1955 concluded that the main failure was weak oversight by the government laboratory responsible for checking vaccines. Senior health officials lost their jobs, including the director of the National Institutes of Health.
      The vaccination campaign continued. By 1957, the number of polio cases in the United States had fallen from nearly fifty-eight thousand a year to about five thousand six hundred.
    candidates: ["Cutter Laboratories Berkeley", "vaccine production laboratory 1955", "polio vaccine vials 1955"]
