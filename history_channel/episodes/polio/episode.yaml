  - id: fdr
    chapter: "IV. The President in the Wheelchair"
    date: "1921"
    narration: >
      In August 1921, a thirty-nine-year-old lawyer and rising politician went on holiday with his family to Campobello, a Canadian island off the coast of Maine. His name was Franklin Delano Roosevelt. During the trip he fell into the cold waters of the Bay of Fundy. A few days later he had a high fever, and then he could no longer move his legs.
      Doctors diagnosed polio. Some modern researchers think it may have been a different illness, Guillain–Barré syndrome. Either way, Roosevelt was left paralysed from the waist down for the rest of his life.
      He refused to give up politics, and he refused to give up hope. He believed that warm water helped his legs, and in 1926 he bought a run-down resort at Warm Springs, in Georgia, and turned it into a centre where people with polio could swim, exercise and rebuild their strength. It became the first modern rehabilitation centre for polio patients.
      In 1933, Roosevelt became President of the United States, and he held the office until his death in 1945. He never forgot the disease.
    candidates: ["Franklin D. Roosevelt Warm Springs", "Campobello 1920s", "Roosevelt wheelchair 1941", "Warm Springs pool polio"]
