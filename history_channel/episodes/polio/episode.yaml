  - id: sabin
    chapter: "XII. Sugar Cubes"
    narration: >
      Salk's rival, Albert Sabin, believed there was a better way: a vaccine made from live but weakened virus, swallowed instead of injected. It would protect not only the person who took it, but also stop the virus spreading in the community.
      Sabin's vaccine needed a huge trial, and in the middle of the Cold War, he found it in the Soviet Union. From 1956, he worked with Soviet scientists, who organised the first mass production. By 1961, his oral vaccine had been given to more than ninety million people in the Soviet Union, Eastern Europe, Singapore, Mexico and the Netherlands.
      It was cheap and easy to give: a few drops on a sugar cube, to hide the bitter taste. Mass vaccination had already pushed polio in the United States down to just a hundred and sixty-one cases in 1961, and Sabin's vaccine was licensed there in 1962. The last cases caused by polio spreading naturally in the United States came in 1979.
    candidates: ["Albert Sabin", "oral polio vaccine sugar cube", "polio vaccination Soviet Union", "Sabin Sunday"]
