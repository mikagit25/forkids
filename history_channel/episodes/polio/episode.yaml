  - id: kenny
    chapter: "VIII. Sister Kenny"
    narration: >
      For those who survived, the standard treatment was rest. Paralysed limbs were put in splints, and many patients lay in plaster body casts for months. Often the muscles only grew weaker.
      In 1940, an Australian bush nurse arrived in North America with a very different idea. Her name was Elizabeth Kenny, and she had treated polio in the rural outback of Queensland. Instead of immobilising limbs, she wrapped them in hot, moist packs to relieve the painful spasms, and then moved and exercised the muscles as early as possible.
      Many doctors resisted. But her results were hard to argue with. She settled in Minnesota, founded an institute, and slowly her method became the standard treatment. Hydrotherapy pools, braces, crutches and new rehabilitation hospitals followed, built for a generation of children who had to learn to walk again.
    candidates: ["Elizabeth Kenny nurse", "Sister Kenny Institute", "polio hot packs therapy", "polio patient Hubbard tank", "polio braces crutches child"]
