  - id: dimes
    chapter: "V. A Dime for Every Child"
    date: "1938"
    narration: >
      In 1938, Roosevelt helped found the National Foundation for Infantile Paralysis. Its fundraising campaign got a name from the entertainer Eddie Cantor, as a pun on a popular newsreel called The March of Time. He called it the March of Dimes, and asked Americans to send a dime, ten cents, straight to the White House.
      At first only a few dimes arrived. Then came the flood. Within days, the White House mail room was receiving forty to fifty thousand letters a day, so many that the President's official mail was buried under them. In the end, two million six hundred and eighty thousand dimes were sent in.
      The March of Dimes changed how charities raised money. Instead of large gifts from a few rich donors, it asked for small gifts from millions of ordinary people. It raised more than any other American charity of its time except the Red Cross. It paid for the treatment of more than eighty per cent of the country's polio patients, and it funded the research that would lead to a vaccine.
