  - id: race
    chapter: "IX. The Race for a Vaccine"
    narration: >
      The first attempts at a vaccine ended badly. In 1935, a young researcher in New York, Maurice Brodie, made a vaccine from virus grown in monkey spinal cords and killed with formaldehyde. He tested it on himself and his assistants, and then on three thousand children. Many had allergic reactions, and none of them became immune.
      The breakthrough came in Boston at the end of the 1940s. John Enders, Thomas Weller and Frederick Robbins found a way to grow the poliovirus in human tissue in the laboratory, instead of in live monkeys. For the first time, the virus could be produced in large amounts. They received the Nobel Prize in 1954.
      Meanwhile, the epidemics grew worse. In 1952, the United States had its worst polio year ever: fifty-seven thousand six hundred and twenty-eight cases. Three thousand one hundred and forty-five people died, and more than twenty-one thousand were left with some degree of paralysis.
      At the University of Pittsburgh, a young doctor named Jonas Salk was working on a vaccine made from virus that had been killed, so that it could no longer cause disease, but still taught the body to recognise it.
    candidates: ["Jonas Salk laboratory", "John Enders Nobel", "University of Pittsburgh 1950s", "poliovirus tissue culture", "polio 1952 epidemic"]
