  - id: ancient
    chapter: "I. An Old Disease"
    narration: >
      Polio is caused by a virus that lives in the human gut. It spreads mostly through contaminated food and water, by what doctors call the faecal–oral route. About three quarters of infections cause no symptoms at all. Some people get a sore throat and a fever, and recover. But in a small proportion of cases, the virus attacks the nerve cells of the spinal cord that control the muscles, and the result is paralysis.
      The disease is very old. Ancient Egyptian paintings and carvings show otherwise healthy people with withered limbs, and young children walking with canes.
      One of the earliest detailed cases is the Scottish novelist Sir Walter Scott. In 1773, as a small child, he was said to have developed a severe teething fever which deprived him of the power of his right leg. He limped for the rest of his life.
      For a long time the disease had no single name. It was called dental paralysis, infantile spinal paralysis, creeping paralysis, and the paralysis of the morning. In 1789, a British doctor, Michael Underwood, gave the first clinical description. In 1840, the German doctor Jakob Heine wrote the first medical report, and in 1890 the Swedish doctor Karl Oskar Medin was the first to study an epidemic. For a time it was known as Heine–Medin disease.
    candidates: ["Egyptian stele polio withered leg", "Walter Scott portrait", "Jakob Heine", "Karl Oskar Medin", "infantile paralysis 19th century"]
