  - id: trial
    chapter: "X. The Polio Pioneers"
    date: "1954–1955"
    narration: >
      In 1954, Salk's vaccine was put to the test in the largest medical experiment the world had ever seen. It was designed and led by Thomas Francis, Salk's former teacher, at the University of Michigan, and paid for by the March of Dimes. One point eight million American children took part. They were called the Polio Pioneers. About four hundred and forty thousand received the vaccine, about two hundred and ten thousand received a harmless placebo, and more than a million were simply observed, to see who caught polio.
      On the twelfth of April 1955, ten years to the day after Roosevelt's death, Francis announced the results in Ann Arbor. The vaccine was safe and effective. Salk was hailed as a miracle worker. The television presenter Edward R. Murrow told him: Young man, a great tragedy has befallen you. You've lost your anonymity.
      When Murrow asked him who owned the patent, Salk replied: Well, the people, I would say. There is no patent.
      Salk never made money from the vaccine.
    candidates: ["Polio Pioneers 1954", "Thomas Francis Ann Arbor 1955", "polio vaccination line 1955", "Salk vaccine injection children", "Jonas Salk 1955"]
