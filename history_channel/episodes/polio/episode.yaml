  - id: eradication
    chapter: "XIV. The Last Two Countries"
    narration: >
      In 1988, the World Health Assembly voted to eradicate polio from the planet, just as smallpox had been. The Global Polio Eradication Initiative, led by the World Health Organization with Rotary International, UNICEF, the CDC and later the Gates Foundation, became the largest international public health effort in history.
      That year, polio paralysed an estimated three hundred and fifty thousand people in a hundred and twenty-five countries. Vaccinators went door to door, village to village, with drops of oral vaccine.
      Two of the three types of wild poliovirus have now been declared eradicated, type two in 2015 and type three in 2019. In 2022, there were only thirty confirmed cases of wild polio in the whole world.
      Today, wild poliovirus survives in only two countries, Pakistan and Afghanistan.
