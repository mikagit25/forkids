  - id: cold-open
    montage: true
    narration: >
      Every summer, for half a century, parents in America and Europe were afraid. Swimming pools closed. Cinemas stood empty. Children were kept indoors, away from fountains and beaches and other children.
      A disease came with the warm weather, and nobody knew how to stop it. Most of the people it infected never noticed a thing. But some woke up unable to move their legs. Some could not breathe, and spent months, years, or the rest of their lives inside a metal machine that breathed for them.
      Then, on the twelfth of April 1955, a scientist in Michigan stepped up to a microphone and changed everything.
      This is the biography of polio.
