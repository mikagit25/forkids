  - id: paradox
    chapter: "II. A Disease of Clean Cities"
    narration: >
      Here is the strange thing. For thousands of years polio was a quiet, scattered disease. Large epidemics began only around 1900, in the richest countries in the world.
      The first report of several cases together came from Louisiana, in 1841. In 1894, Vermont had the first recognised epidemic in the United States: a hundred and thirty-two cases and eighteen deaths. By 1907, New York City reported about two and a half thousand cases.
      The explanation, as scientists later understood it, was cleanliness. In earlier centuries, almost every child met the virus very early, before the age of four. In young children the infection was usually mild, and it left them immune for life.
      Then cities built sewers and clean water supplies. Babies no longer met the virus so early. They caught it later, as older children or adults, when it was much more likely to cause paralysis. In children, paralysis comes in about one case in a thousand; in adults, about one in seventy-five.
      Polio had become a disease of modern, sanitary cities. And it struck in summer.
    candidates: ["New York tenement 1900s", "city water works 1900", "Vermont 1894", "summer children street 1910s"]
