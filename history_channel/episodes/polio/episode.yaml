  - id: closing
    chapter: "Epilogue"
    narration: >
      For most families today, polio is a word from their grandparents' stories: iron lungs, leg braces, closed swimming pools, and the long fearful summers.
      That is exactly what the vaccine was for. The disease that once paralysed half a million people a year is now on the edge of disappearing, thanks to scientists, nurses and medical students, and millions of dimes sent by ordinary people.
