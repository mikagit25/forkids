  - id: lung
    chapter: "VI. The Iron Lung"
    narration: >
      Polio's most frightening form attacked the muscles used for breathing. Patients slowly suffocated.
      In 1928, at Harvard, Philip Drinker and Louis Agassiz Shaw built a machine to breathe for them. The first iron lung was tested on the twelfth of October 1928 at the Children's Hospital in Boston. It was powered by an electric motor and two vacuum cleaners. The patient lay inside a sealed metal tank with only the head outside. When the air pressure inside dropped, the chest expanded and air rushed into the lungs; when the pressure rose, the air was pushed out.
      The iron lung saved many thousands of lives. But it was huge, noisy and expensive. In the 1930s, one machine cost about fifteen hundred dollars, roughly the price of a house. During the worst epidemics, hospital wards were filled with rows of them, each with a child's head sticking out at one end. Patients often stayed inside for months, sometimes for years. Even with an iron lung, more than nine out of ten patients with the worst form of the disease died.
      Some never left. Paul Alexander, from Dallas, caught polio at the age of six in 1952. He lived in an iron lung for seventy-two years. He taught himself a special breathing technique that let him leave the machine for short periods. He finished school from home, earned a law degree from the University of Texas, and represented clients in court. He spent eight years writing a memoir, tapping the keys with a stick held in his mouth. He died in March 2024, at the age of seventy-eight.
    candidates: ["iron lung ward 1950s", "Drinker respirator 1928", "iron lung patient mirror", "Emerson iron lung"]
