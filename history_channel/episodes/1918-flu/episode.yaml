# Episode definition. Everything the pipeline needs lives here.
# Workflow: edit narration -> fact-check (factcheck.md) -> fetch -> review contact sheet -> render.

title: "1918: The Pandemic That Hid Behind a War"
subtitle: "How the deadliest flu in history spread, and how science brought it back to life"
slug: 1918-flu
language: en
voice:
  backend: kokoro        # kokoro (free, local) | openai (paid API)
  name: bm_george        # kokoro voices: bm_george, bm_lewis, am_michael, am_onyx, bf_emma ...
  lang: en-gb
  speed: 0.93
music: null              # optional path to a royalty-free ambient track, mixed quietly under the voice

scenes:
  - id: cold-open
    narration: >
      In the autumn of 1918, the First World War was finally coming to an end.
      Millions of young men were on the move: in trains, in troop ships, in crowded camps.
      And travelling with them was something far deadlier than any weapon on the Western Front.
      Within two years it would infect around five hundred million people, one in three humans alive.
      It would kill at least fifty million. Some estimates say twice that.
      This is the story of the 1918 influenza pandemic, and of the scientists who, almost a century later, brought the virus back to life.
    images:
      - {query: "1918 influenza emergency hospital", count: 2}
      - {query: "troops 1918 troopship", count: 1}

  - id: kansas
    chapter: "I. A Cook in Kansas"
    date: "March 1918"
    narration: >
      The story is usually told starting at Camp Funston, a vast army training camp in Kansas.
      On a morning in early March 1918, a company cook reported to the infirmary with a fever, a sore throat and aching muscles.
      By lunchtime, dozens more soldiers had joined him. Within weeks, more than a thousand men were sick.
      Most of them recovered. This first wave looked like an ordinary, if unusually fast, spring flu.
      Historians still argue about where the virus really began. Kansas, France, Britain and China have all been proposed.
      What is certain is that the army camps of 1918 were perfect incubators, and the war gave the virus a free ride across the Atlantic.
    images:
      - {query: "Camp Funston influenza", count: 2}
      - {query: "Camp Funston 1918", count: 1}

  - id: name
    chapter: "II. The Wrong Name"
    narration: >
      The world would come to call it the Spanish flu. But it almost certainly did not start in Spain.
      Spain was neutral in the war, and its newspapers were not censored.
      While the warring nations kept news of sickness quiet to protect morale, Spanish papers reported the epidemic openly,
      including the illness of their own king, Alfonso the Thirteenth.
      So it looked, to the rest of the world, as if Spain was the worst hit.
      In Spain, meanwhile, many people called it the French flu.
    images:
      - {query: "Alfonso XIII Kaulak", count: 1}
      - {query: "1918 newspaper influenza", count: 1}
      - {query: "Madrid 1918", count: 1}

  - id: second-wave
    chapter: "III. The Second Wave"
    date: "Autumn 1918"
    narration: >
      In late August 1918, the virus came back, and it had changed.
      Almost at the same time, a far more lethal form appeared in ports on three continents:
      Brest in France, Freetown in Sierra Leone, and Boston in the United States.
      Healthy people could feel well at breakfast and be dead by nightfall.
      Doctors described patients whose faces turned a dusky blue as their lungs filled with fluid, a sign of oxygen starvation that nurses learned to dread.
      October 1918 became the deadliest month in American history.
    images:
      - {query: "1918 influenza ward nurses", count: 2}
      - {query: "Red Cross influenza epidemic 1918", count: 2}

  - id: philadelphia
    chapter: "IV. The Parade"
    date: "28 September 1918"
    narration: >
      Nowhere shows the cost of a bad decision more clearly than Philadelphia.
      On the twenty-eighth of September, the city went ahead with a huge parade to sell war bonds.
      Officials had expected around ten thousand spectators. More than two hundred thousand people packed the streets.
      Within days, every hospital bed in the city was full.
      In the weeks that followed, Philadelphia ran out of coffins and gravediggers, and more than twelve thousand of its people died.
    images:
      - {query: "Philadelphia Liberty Loan parade 1918", count: 2}
      - {query: "Liberty Bonds Parades Philadelphia", count: 2}

  - id: who-it-killed
    chapter: "V. The Wrong Victims"
    narration: >
      Ordinary flu kills mostly the very young and the very old.
      The 1918 virus did that too, but it also struck down healthy adults between twenty and forty, people in the prime of their lives.
      Researchers still debate why. One theory is that strong young immune systems over-reacted, flooding the lungs with inflammation.
      Another is that older people had been exposed to a similar virus decades earlier, and kept some protection.
      Whatever the reason, the effect was staggering. In the United States, life expectancy fell by more than ten years in a single year.
    images:
      - {query: "1918 influenza victims", count: 1}
      - {query: "1918 influenza soldiers hospital", count: 2}

  - id: no-medicine
    chapter: "VI. Fighting Without Medicine"
    narration: >
      Doctors in 1918 had no vaccine against influenza, and no antibiotics to treat the bacterial pneumonia that killed so many patients.
      They did not even know that the disease was caused by a virus. That would not be discovered until the 1930s.
      So cities fought back with the only tools they had: closing schools, churches and theatres, banning public gatherings, and ordering people to wear gauze masks.
      Those measures were unpopular, and they were applied unevenly. But studies of the pandemic later showed that cities which acted early and kept their restrictions in place, like St. Louis,
      saw far lower peaks of death than cities that hesitated.
    images:
      - {query: "Seattle police masks 1918", count: 1}
      - {query: "chart influenza deaths 1918 cities", count: 1}
      - {query: "1918 influenza mask", count: 2}
      - {query: "influenza 1918 poster", count: 2}

  - id: brevig
    chapter: "VII. The Village in the Ice"
    date: "Brevig Mission, Alaska"
    narration: >
      In November 1918, the virus reached Brevig Mission, a tiny village on the coast of Alaska.
      In five days, seventy-two of its eighty adults died. They were buried together in a mass grave in the frozen ground.
      In 1951, a young Swedish scientist named Johan Hultin dug into that grave, hoping to recover the virus. He failed.
      Forty-six years later, at the age of seventy-two, he went back.
      This time he found the body of a woman, preserved by the permafrost, whose lungs still carried fragments of the virus's genetic code.
    images:
      - {query: "Brevig Mission", count: 1}
      - {query: "Seward Peninsula Alaska village 1910s", count: 1}
      - {query: "permafrost Alaska tundra", count: 1}

  - id: resurrection
    chapter: "VIII. Bringing It Back"
    date: "2005"
    narration: >
      Working with Jeffery Taubenberger's team, who had pieced together the virus's genes from preserved tissue samples,
      scientists finally had the complete genetic recipe of the 1918 virus.
      In 2005, at a high-security laboratory at the US Centers for Disease Control, the microbiologist Terrence Tumpey reconstructed it.
      For the first time since 1918, the virus existed again, so that researchers could finally ask what made it so lethal, and how to recognise the next one before it spreads.
    images:
      - {query: "Terrence Tumpey 1918 influenza", count: 1}
      - {query: "1918 influenza virus electron micrograph", count: 2}

  - id: closing
    chapter: "Epilogue"
    narration: >
      The 1918 pandemic killed more people than the war it travelled with. Yet for decades it was almost forgotten, overshadowed by the armistice and the peace.
      Its lessons were written in the records of crowded hospitals, emergency ordinances and mass graves.
      And they came back into focus every time a new virus began to spread.
      If you enjoyed this story from the archives, subscribe for more forgotten chapters of medical history.
    images:
      - {query: "Armistice Day 1918 crowd", count: 1}
      - {query: "1918 influenza nurse", count: 1}

