  - id: origin
    chapter: "I. Out of Asia"
    narration: >
      The plague is caused by a bacterium, Yersinia pestis. It lives in wild rodents and is spread among them by fleas. When infected rodents die, their hungry fleas look for new hosts, and sometimes those hosts are human.
      Ancient DNA has shown that plague infected people thousands of years ago, and one great pandemic, the Plague of Justinian, struck the Mediterranean in the sixth century. It appeared in 541 at the Egyptian port of Pelusium, and reached Constantinople the following year. The historian Procopius wrote that at its peak it was killing ten thousand people a day in the capital, a figure modern historians treat with caution. The emperor Justinian himself caught it, and survived. In 2013, DNA from victims of that pandemic confirmed that it was caused by the same bacterium.
      The strain behind the Black Death seems to have emerged in Central Asia. In 2022, scientists studying gravestones and remains from the 1330s near Lake Issyk-Kul, in what is now Kyrgyzstan, identified the direct ancestor of the bacterium that would devastate Europe.
      From there, it travelled west along the trade routes of the Mongol world.
