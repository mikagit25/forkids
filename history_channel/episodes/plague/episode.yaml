  - id: returns
    chapter: "VIII. The Plague Returns"
    date: "1348–1720"
    narration: >
      The plague never really left. It came back to Europe every few years for nearly four centuries.
      It began quietly. On the thirtieth of April 1665, Samuel Pepys noted in his diary the first cases in the city. The Great Plague of London went on to kill around a hundred thousand people, almost a quarter of the city, in eighteen months. Weekly bills of mortality listed the dead parish by parish; they recorded sixty-eight thousand plague deaths, and the real number was certainly higher. Doors of infected houses were marked with a red cross and the words, Lord have mercy upon us, and a watchman stood outside. The city ordered dogs and cats to be killed. Those who could, fled. Daniel Defoe, in his Journal of the Plague Year, described the roads out of the city: nothing was to be seen but wagons and carts, with goods, women, servants, children, all hurrying away. Pepys, who stayed in London, wrote: Lord! How empty the streets are, and how melancholy.
      That autumn, a bundle of cloth from London was delivered to a tailor in the village of Eyam, in Derbyshire. His assistant, George Viccars, opened it, found it damp, and hung it by the fire. Within days he was dead. As the plague spread, the rector, William Mompesson, persuaded the villagers to do something extraordinary: to seal themselves off, so the disease would not spread to the towns around them. Neighbouring villages left food at boundary stones, and the villagers paid with coins left in holes filled with vinegar. The plague lasted fourteen months. At least two hundred and sixty villagers died. One woman, Elizabeth Hancock, buried her husband and six of her children in eight days. The rector's own wife, Catherine Mompesson, was among the dead. Every year, on Plague Sunday, a wreath is still laid on her grave.
      In May 1720, a merchant ship, the Grand Saint Antoine, arrived in Marseille from the eastern Mediterranean, carrying silk and cotton and the plague. Powerful merchants wanted the cargo in time for a great fair, and pressured the authorities to cut the quarantine short. About fifty thousand of the city's ninety thousand people died, and fifty thousand more in the surrounding region. To stop the disease, the authorities built a wall across the countryside of Provence, the plague wall. Marseille's population did not recover until 1765. It was the last great outbreak of plague in Western Europe.
      Then, slowly and for reasons still debated, plague retreated from Western Europe.
