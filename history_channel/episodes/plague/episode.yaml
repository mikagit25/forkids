  - id: treatments
    chapter: "VI. Bleeding and Theriac"
    narration: >
      What could doctors actually do? Very little.
      They let blood, to rebalance the body's humours. They lanced buboes. They prescribed theriac, an ancient compound medicine with dozens of ingredients, sometimes including viper flesh. The wealthy were advised to flee early, go far, and return late.
      The most famous image of the plague doctor, with a long beaked mask stuffed with herbs, a waxed coat and a stick, does not actually come from the Black Death. It appeared in the seventeenth century, during later outbreaks.
      But one measure did work. In 1377, the city of Ragusa, today's Dubrovnik, ordered ships from plague areas to wait thirty days before landing. The period was later extended to forty days, quaranta giorni in Italian. That is where our word quarantine comes from.
