  - id: closing
    chapter: "Epilogue"
    narration: >
      The plague gave us quarantine, health boards, and the idea that a city could act together against disease. It also showed how quickly fear can turn on the vulnerable.
      Nearly seven hundred years after the Black Death, both lessons still matter.
      In the next story from the history of disease, we look at a killer that humans actually managed to wipe from the face of the Earth.
      Subscribe so you don't miss it.
