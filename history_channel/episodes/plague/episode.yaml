  - id: caffa
    chapter: "II. The Siege of Caffa"
    date: "1346"
    narration: >
      In 1346, the army of the Golden Horde was besieging Caffa, a Genoese trading port on the Black Sea coast of Crimea.
      Then plague broke out among the besiegers.
      According to an account written soon afterwards by the Italian lawyer Gabriele de' Mussis, the attackers hurled the corpses of plague victims over the city walls with catapults.
      Whether or not it happened exactly this way, the disease entered the city. Genoese ships fled Caffa, and carried the plague with them across the sea, to Constantinople and then to the Mediterranean.
    images:
      # hand-picked after visual review (Commons, Met, Cleveland, Art Institute of Chicago)
      - {file: "curid:50084154"}
      - {file: "curid:6262537"}
