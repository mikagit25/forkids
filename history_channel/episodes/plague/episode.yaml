  - id: persecution
    chapter: "V. Scapegoats"
    narration: >
      Fear turned to hatred. Across Europe, Jewish communities were falsely accused of poisoning wells to spread the disease.
      Pope Clement the Sixth condemned the accusations, pointing out that Jews were dying of the plague like everyone else. It made little difference.
      In Strasbourg, in February 1349, around two thousand Jews were murdered. Hundreds of communities in Germany and beyond were attacked or destroyed.
      It is one of the darkest chapters of the pandemic, and a warning that epidemics do not only spread disease.
    images:
