  - id: yersin
    chapter: "IX. Hong Kong, 1894"
    date: "1894"
    narration: >
      At the end of the nineteenth century, a third great plague pandemic began in China. In 1894 it reached Hong Kong.
      Two scientists raced to find its cause. One was the Japanese bacteriologist Kitasato Shibasaburō. The other was a Swiss-born French doctor from the Pasteur Institute, Alexandre Yersin, working from a bamboo hut.
      Yersin found the bacterium in the buboes of victims, and correctly described it. It was later named after him: Yersinia pestis.
      A few years later, researchers proved the role of rat fleas in carrying it. After more than five centuries, the killer finally had a name and a route.
