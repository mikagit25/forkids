  - id: aftermath
    chapter: "VII. A Changed World"
    narration: >
      The Black Death transformed European society.
      With so many workers dead, survivors could demand higher wages and better conditions. Landowners and governments tried to freeze wages by law. In England, King Edward the Third issued the Ordinance of Labourers in 1349, fixing wages at their level before the plague, and Parliament confirmed it with the Statute of Labourers in 1351. Landlords who needed tenants began to accept rents in money instead of labour in their fields. The tension between what workers could demand and what the law allowed fed anger that later exploded in revolts such as the English Peasants' Revolt of 1381.
      Art became haunted by death. The Dance of Death, with skeletons leading kings, bishops and peasants alike to the grave, became a favourite theme of painters across Europe.
