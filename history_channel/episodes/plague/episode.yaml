  - id: explanations
    chapter: "IV. Stars, Air and Sin"
    narration: >
      Medieval people tried desperately to understand what was happening.
      In 1348, the medical faculty of the University of Paris produced a report for the King of France. It blamed an unlucky conjunction of the planets Saturn, Jupiter and Mars, which had corrupted the air.
      Most doctors believed in miasma, poisonous air. People carried posies of flowers and herbs, burned aromatic woods, and avoided the south wind.
      Others saw the plague as God's punishment. Groups of flagellants marched from town to town, whipping themselves in public to atone for the sins of the world. In Germany and the Low Countries, the Brothers of the Cross wore white robes and processed through the streets for thirty-three days at a time, one day for each year of Christ's life. At first crowds welcomed them. But the movement grew out of the Church's control, and in October 1349 Pope Clement the Sixth condemned it and ordered it suppressed.
