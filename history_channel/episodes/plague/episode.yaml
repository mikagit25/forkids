  - id: today
    chapter: "X. Plague Today"
    narration: >
      Today, the plague is treatable. Antibiotics such as streptomycin cure most patients if they are treated early.
      But the bacterium still lives in wild rodents on several continents, including the western United States. Every year there are human cases, most of them in Africa, especially Madagascar.
      In 2017, an outbreak of pneumonic plague in Madagascar caused more than two thousand cases and over two hundred deaths before it was brought under control.
      The disease that once killed half of Europe is now rare, and usually curable. But it has never been eradicated.
