scenes:
  - id: cold-open
    montage: true          # fast cuts + one teaser photo from every chapter
    narration: >
      In the autumn of 1347, ships arrived in Sicily carrying something no one in Europe had seen in living memory.
      Within five years, between a third and half of all Europeans were dead.
      People blamed the stars, the air, God's anger, and their Jewish neighbours. Doctors cut veins, burned herbs and prayed.
      The same disease came back again and again for four hundred years. It was finally identified only in 1894, in Hong Kong.
      And it has never completely gone away.
      This is the biography of the plague.
