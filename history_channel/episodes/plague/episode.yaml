  - id: explanations
    chapter: "IV. Stars, Air and Sin"
    narration: >
      Medieval people tried desperately to understand what was happening.
      In 1348, the medical faculty of the University of Paris produced a report for the King of France. It blamed an unlucky conjunction of the planets Saturn, Jupiter and Mars, which had corrupted the air.
      Most doctors believed in miasma, poisonous air. People carried posies of flowers and herbs, burned aromatic woods, and avoided the south wind.
      Others saw the plague as God's punishment. Groups of flagellants marched from town to town, whipping themselves in public to atone for the sins of the world.
