  - id: aftermath
    chapter: "VII. A Changed World"
    narration: >
      The Black Death transformed European society.
      With so many workers dead, survivors could demand higher wages and better conditions. Landowners and governments tried to freeze wages by law, which fed anger that later exploded in revolts such as the English Peasants' Revolt of 1381.
      Art became haunted by death. The Dance of Death, with skeletons leading kings, bishops and peasants alike to the grave, became a favourite theme of painters across Europe.
