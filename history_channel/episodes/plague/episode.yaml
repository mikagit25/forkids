  - id: persecution
    chapter: "V. Scapegoats"
    narration: >
      Fear turned to hatred. Across Europe, Jewish communities were falsely accused of poisoning wells to spread the disease.
      Pope Clement the Sixth issued two papal bulls in 1348 condemning the accusations. His own physician, Guy de Chauliac, who had treated plague victims himself, argued that Jews were not to blame, and that they were dying of the plague like everyone else. It made little difference. On the fourteenth of February 1349, in Strasbourg, around two thousand Jews were burned alive, before the plague had even reached the city. The new emperor, Charles the Fourth, declared that the property of Jews killed in riots would be forfeit, which gave local rulers a reason to look away. Hundreds of communities in Germany and beyond were attacked or destroyed.
      It is one of the darkest chapters of the pandemic, and a warning that epidemics do not only spread disease.
