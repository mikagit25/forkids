  - id: arrival
    chapter: "III. The Great Mortality"
    date: "1347–1351"
    narration: >
      In October 1347, the plague reached Sicily. From there it spread with terrifying speed: to Italy, France, Spain and England by the summer of 1348, then Germany, Scandinavia and finally Russia. In England, the first known case was a sailor who landed at Weymouth, in Dorset, in June 1348. By the autumn it was in London, and by the following summer it covered the whole country.
      Most victims developed the bubonic form. A high fever was followed by painful swellings, called buboes, in the groin, armpits or neck. Many died within days.
      Some caught the pneumonic form, which attacks the lungs and spreads from person to person through coughing. It was almost always fatal.
      Whole villages were emptied. Cities dug mass graves when the churchyards were full. In Florence, the writer Giovanni Boccaccio described people falling dead in the streets, and families abandoning each other in fear. In Siena, a chronicler named Agnolo di Tura wrote: I buried my five children with my own hands. There was no one who wept for any death, for all awaited death. And so many died that all believed it was the end of the world. In London, the dead were laid in rows in new emergency cemeteries such as East Smithfield, where, more than six hundred years later, scientists recovered the bacterium's DNA from the victims' teeth. Across Europe, the Black Death killed perhaps thirty to sixty per cent of the population, up to fifty million people, in about five years.
