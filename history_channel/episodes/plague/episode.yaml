  - id: returns
    chapter: "VIII. The Plague Returns"
    date: "1348–1720"
    narration: >
      The plague never really left. It came back to Europe every few years for nearly four centuries.
      In 1665, the Great Plague of London killed around a hundred thousand people, perhaps a quarter of the city. Weekly bills of mortality listed the dead parish by parish. Doors of infected houses were marked with a red cross and the words, Lord have mercy upon us.
      In 1720, a ship brought plague to Marseille, and about half the city's population died.
      Then, slowly and for reasons still debated, plague retreated from Western Europe.
