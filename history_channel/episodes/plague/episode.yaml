  - id: yersin
    chapter: "IX. Hong Kong, 1894"
    date: "1894"
    narration: >
      At the end of the nineteenth century, a third great plague pandemic began in China. In 1894 it reached Hong Kong. The first case was found on the eighth of May, a young hospital worker, and two days later the colony was declared an infected port.
      Two scientists raced to find its cause. One was the Japanese bacteriologist Kitasato Shibasaburō, sent by his government, who arrived on the twelfth of June with a team of five, and was given access to the bodies at the city's hospital. The other was a Swiss-born French doctor from the Pasteur Institute, Alexandre Yersin. He arrived alone three days later, with a microscope and a sterilizer in his luggage. The British doctor in charge saw France as a rival and gave him no help: the bodies were reserved for Kitasato. So Yersin bribed the English sailors whose job was to take away the dead, and took samples from the swellings of the victims. On the twenty-third of June he saw the bacterium. Kitasato found it too, but his description was confused, and his samples were probably contaminated. Yersin sealed a specimen in a glass tube and posted it to Paris, where his colleagues confirmed it. He also found the same bacterium in dead rats. After several changes of name, the bacterium was finally called after him, around 1970: Yersinia pestis.
      A few years later, in 1898, another Pasteur Institute doctor, Paul-Louis Simond, working in Karachi, put a dying plague-infected rat with fleas into a glass jar, and lowered a healthy rat into the jar, separated from it by a wire mesh. Five days later, the healthy rat was dead of plague. The fleas had carried it. This third pandemic had begun in the Chinese province of Yunnan in the 1850s, and spread by steamship to ports all over the world. It killed at least fifteen million people, ten to twelve million of them in British India. In 1900 it reached San Francisco, where the governor of California denied that there was any plague at all, to protect business. In Chinatown, a hundred and nineteen people died. In Manchuria in 1910, a pneumonic plague outbreak killed some sixty thousand people. A Cambridge-trained Chinese doctor, Wu Lien-teh, organised quarantines and persuaded doctors, nurses and patients to wear cloth face masks, one of the first times masks were used to fight an epidemic. After more than five centuries, the killer finally had a name and a route.
