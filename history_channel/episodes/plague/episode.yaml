  - id: arrival
    chapter: "III. The Great Mortality"
    date: "1347–1351"
    narration: >
      In October 1347, the plague reached Sicily. From there it spread with terrifying speed: to Italy, France, Spain and England by the summer of 1348, then Germany, Scandinavia and finally Russia.
      Most victims developed the bubonic form. A high fever was followed by painful swellings, called buboes, in the groin, armpits or neck. Many died within days.
      Some caught the pneumonic form, which attacks the lungs and spreads from person to person through coughing. It was almost always fatal.
      Whole villages were emptied. Cities dug mass graves when the churchyards were full. In Florence, the writer Giovanni Boccaccio described people falling dead in the streets, and families abandoning each other in fear.
