  - id: coleman
    chapter: "IV. The Last Message"
    narration: >
      At the Richmond railway station, near the pier, a train dispatcher named Vince Coleman learned what the burning ship was carrying.
      He could have run. Instead he returned to his telegraph key to warn incoming trains to stop.
      His message is usually recorded like this.
      Munitions ship on fire. Making for Pier 6. Goodbye.
      Vince Coleman was killed at his post moments later. An overnight express from Saint John, carrying about three hundred passengers, was due within minutes. Whether his warning is what stopped it, historians still debate. But stations all along the line heard him, and help was sent sooner because of it. Accounts differ over how many lives his message saved, but he became one of the best-remembered heroes of that day.
