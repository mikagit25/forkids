  - id: blame
    chapter: "X. Who Was to Blame?"
    narration: >
      Grief quickly turned to anger.
      In the first hours, many survivors were convinced that German aircraft had bombed the city. Troops manned the guns. Within days, people of German descent in Halifax were rounded up and arrested, until the real cause of the explosion became clear. An official inquiry, led by Justice Arthur Drysdale, blamed the Mont-Blanc's captain, Aimé Le Médec, her pilot, Francis Mackey, and Commander Evan Wyatt, the naval officer responsible for harbour traffic. All three were charged with manslaughter. The charges against the captain and pilot were dropped, and a jury acquitted Wyatt in less than a day.
      A civil court found the Mont-Blanc entirely at fault. But on appeal, first the Supreme Court of Canada and then, in 1920, the Privy Council in London ruled that both ships were equally to blame.
      No one was ever convicted.
      The disaster did change the rules. Ports around the world began to take the handling of explosive cargo far more seriously.
