  de:
    title: "Halifax 1917: Die größte Explosion vor der Atombombe"
    subtitle: "Wie eine Kollision in einem kanadischen Hafen eine Stadt in einer Sekunde zerstörte"
    summary: >
      Am Morgen des 6. Dezember 1917 stieß im engen Hafen von Halifax ein französisches Schiff voller Kriegssprengstoff mit
      einem norwegischen Hilfsschiff zusammen. Zwanzig Minuten später explodierte die Mont-Blanc mit der Kraft von etwa 2,9
      Kilotonnen TNT – die größte von Menschen verursachte Explosion vor der Atombombe. Fast zweitausend Menschen starben,
      neuntausend wurden verletzt, ein ganzer Stadtteil verschwand. Dies ist die Geschichte jenes Morgens: der
      Eisenbahn-Fahrdienstleiter, der auf seinem Posten blieb, der Schneesturm danach, die Hilfe aus Boston, die Prozesse,
      die alle und niemanden schuldig sprachen, und die Stadt, die sich neu aufbaute.
    chapters: ["Einleitung", "Eine Stadt im Krieg", "Zwei Schiffe", "Zwanzig Minuten", "Die letzte Nachricht", "9:04:35",
               "Die verwundete Stadt", "In den Trümmern", "Der Schneesturm", "Hilfe aus Boston", "Wer war schuld?", "Epilog"]
