  pt:
    title: "Halifax 1917: a maior explosão antes da bomba atômica"
    subtitle: "Como uma colisão num porto canadense destruiu uma cidade em um segundo"
    summary: >
      Na manhã de 6 de dezembro de 1917, um navio francês carregado de explosivos de guerra colidiu com um navio norueguês de
      ajuda humanitária no estreito do porto de Halifax. Vinte minutos depois, o Mont-Blanc explodiu com a força de cerca de
      2,9 quilotons de TNT, a maior explosão causada pelo homem antes da bomba atômica. Quase duas mil pessoas morreram, nove
      mil ficaram feridas e um bairro inteiro desapareceu. Esta é a história daquela manhã: o despachante ferroviário que
