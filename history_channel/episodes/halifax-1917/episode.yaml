  fr:
    title: "Halifax 1917 : la plus grande explosion avant la bombe atomique"
    subtitle: "Comment une collision dans un port canadien a détruit une ville en une seconde"
    summary: >
      Le matin du 6 décembre 1917, un navire français chargé d'explosifs de guerre entre en collision avec un navire
      humanitaire norvégien dans le goulet du port d'Halifax. Vingt minutes plus tard, le Mont-Blanc explose avec une force
      d'environ 2,9 kilotonnes de TNT : la plus grande explosion d'origine humaine avant la bombe atomique. Près de deux mille
      personnes meurent, neuf mille sont blessées et tout un quartier disparaît. Voici l'histoire de cette matinée : le
      répartiteur ferroviaire resté à son poste, le blizzard qui suivit, l'aide venue de Boston, les procès qui accusèrent
      tout le monde et personne, et la ville qui se reconstruisit.
    chapters: ["Introduction", "Une ville en guerre", "Deux navires", "Vingt minutes", "Le dernier message", "9:04:35",
