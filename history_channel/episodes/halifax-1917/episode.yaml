  - id: boston
    chapter: "IX. Help from Boston"
    narration: >
      Help came quickly from across Canada, from Britain, and above all from the United States.
      Rescue trains arrived the same day from towns across Nova Scotia and New Brunswick. In Boston, the banker and Red Cross organiser Abraham Ratshesky led the relief effort.
      Boston sent a relief train loaded with doctors, nurses and medical supplies, and the Massachusetts relief committee raised money and materials for months.
      Halifax never forgot it. In 1918, the city sent Boston a Christmas tree as a thank-you.
      The tradition was revived in 1971 and continues today. Every year, a tree from Nova Scotia stands on Boston Common.
      The Canadian government gave eighteen million dollars, the British government more than four million, and the state of Massachusetts seven hundred and fifty thousand. The Halifax Relief Commission was set up to care for the injured, the orphaned and the homeless, and to rebuild what had been destroyed. It went on supporting survivors for decades.
