  - id: rebuild
    chapter: "Epilogue"
    narration: >
      Richmond was rebuilt. Part of it became the Hydrostone, a neighbourhood of solid concrete-block row houses built by the Halifax Relief Commission, one of Canada's first public housing projects.
      Its three hundred and twenty-six homes were built of compressed cement blocks called hydrostone, chosen because they would not burn. The first families moved in by March 1919, and that summer the Prince of Wales came to see them. People still live there today.
      Every year on the sixth of December, Halifax remembers the people it lost, at nine o'clock, four minutes and thirty-five seconds.
      If you enjoyed this story from the archives, subscribe for more forgotten chapters of history.
