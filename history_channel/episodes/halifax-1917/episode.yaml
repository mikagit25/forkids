  - id: ships
    chapter: "II. Two Ships"
    date: "6 December 1917"
    narration: >
      That morning, two ships were heading for the Narrows from opposite directions.
      Coming in was the Mont-Blanc, a French cargo ship. Her holds were packed with high explosives: picric acid, TNT and guncotton. On her deck sat barrels of benzol, a highly flammable fuel.
      Before the war, ships carrying explosives had not been allowed into the harbour at all. But the danger from German submarines was greater, and the rules had been relaxed. The harbour pilot who came aboard, Francis Mackey, asked whether there would be any special protection for such a cargo, a guard ship perhaps. There was none. The Mont-Blanc had arrived too late the evening before; the nets were already closed, and she waited outside overnight.
      Going out was the Imo, a Norwegian ship chartered by the Commission for Relief in Belgium, sailing empty to New York to load food for the starving people of occupied Belgium. Her coal had arrived late the day before, and she too had missed the nets. Now she was in a hurry. The captain of a harbour tug, the Stella Maris, saw her coming through the Narrows far too fast, and steered out of her way.
      The two ships found themselves on the same side of the channel. Signals were exchanged, misunderstood, and exchanged again.
      At about a quarter to nine, the Imo's bow struck the Mont-Blanc.
