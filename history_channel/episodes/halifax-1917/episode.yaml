research:                # newspapers of the time: python run.py episodes/halifax-1917 research
  - {q: "Halifax explosion", from: 1917-12-06, to: 1918-01-31, sources: [chronam, nyt, trove, europeana]}

summary: >
  On the morning of 6 December 1917, a French ship packed with wartime explosives collided with a Norwegian relief ship in
  the narrows of Halifax harbour. Twenty minutes later the Mont-Blanc blew up with the force of about 2.9 kilotons of TNT,
  the largest man-made explosion before the atomic bomb. Nearly two thousand people died, nine thousand were injured and a
  whole district vanished. This is the story of that morning: the railway dispatcher who stayed at his post, the blizzard
  that followed, the help that came from Boston, the trials that blamed everyone and no one, and the city that rebuilt.

localizations:
  es:
    title: "Halifax 1917: la mayor explosión antes de la bomba atómica"
    subtitle: "Cómo una colisión en un puerto canadiense destruyó una ciudad en un segundo"
    summary: >
      La mañana del 6 de diciembre de 1917, un barco francés cargado de explosivos de guerra chocó con un barco noruego de
      ayuda humanitaria en el estrecho del puerto de Halifax. Veinte minutos después, el Mont-Blanc estalló con una fuerza de
      unos 2,9 kilotones de TNT, la mayor explosión provocada por el ser humano antes de la bomba atómica. Murieron casi dos
      mil personas, nueve mil resultaron heridas y un barrio entero desapareció. Esta es la historia de aquella mañana: el
      telegrafista ferroviario que no abandonó su puesto, la ventisca que vino después, la ayuda que llegó de Boston, los
      juicios que culparon a todos y a nadie, y la ciudad que se reconstruyó.
    chapters: ["Introducción", "Una ciudad en guerra", "Dos barcos", "Veinte minutos", "El último mensaje", "9:04:35",
