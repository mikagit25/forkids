  - id: century
    chapter: "VII. Still a Killer"
    narration: >
      Even presidents were not safe. In November 1863, Abraham Lincoln was already falling ill when he delivered the Gettysburg Address. Days later, his doctors found that he had smallpox. Two decades later, in Georgia, a small boy named Joseph Stalin caught smallpox, and carried its scars on his face for the rest of his life.
      Despite vaccination, smallpox remained one of the great killers of the twentieth century. Vaccination was uneven, especially in poorer countries, and outbreaks continued around the world. Historians estimate that smallpox killed around three hundred million people in the twentieth century alone. By the 1950s, wealthy countries had largely eliminated it at home. But as long as it existed anywhere, it could return anywhere. And in 1947, it reached New York. A rug merchant returning by bus from Mexico fell ill and died in a city hospital. Within a month the city had vaccinated more than six million people, five million of them in just two weeks, in queues that stretched around the block. Only twelve people caught smallpox, and two of them died.
