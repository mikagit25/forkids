summary: >
  For three thousand years smallpox killed kings and peasants alike: its marks are suspected on Egyptian mummies, it
  helped topple the empires of the Aztecs and the Inca, and it killed an emperor of Russia and a queen of England. This is
  the biography of the speckled monster: the healers who fought it with its own scabs, Lady Mary Wortley Montagu and
  Zabdiel Boylston, the milkmaid's secret behind Edward Jenner's cowpox vaccine, the cartoonists who mocked it, the
  twenty-two orphans who carried the vaccine across the ocean, and the WHO campaign that hunted down the last natural case
  in Somalia in 1977. It is the only human disease we ever wiped out.

