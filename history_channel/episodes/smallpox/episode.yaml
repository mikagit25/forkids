  - id: mockery
    chapter: "V. Cows and Cartoons"
    narration: >
      Not everyone was convinced. Some clergymen objected to infecting humans with animal disease. Critics warned that vaccinated people might start to look like cows.
      In 1802, the caricaturist James Gillray drew a famous cartoon showing Jenner vaccinating a crowd of frightened patients, with tiny cows bursting out of their arms and faces.
      But vaccination was far safer than variolation, and it spread rapidly. Jenner's work was translated into several languages within a few years. Bavaria made vaccination compulsory for army recruits in 1807.
      In America, Thomas Jefferson vaccinated his own family and neighbours, and in 1806 he wrote to Jenner that future nations would know by history only that the loathsome smallpox had existed.
      In Britain, vaccination of infants became compulsory in 1853. Fines and even prison for refusing provoked fierce resistance. On the twenty-third of March 1885, thousands of people marched through the town of Leicester in one of the largest anti-vaccination demonstrations ever held, and in 1898 the law was changed to allow conscientious objectors to refuse.
