      - {file: "web:nlm:101430419", image: "https://collections.nlm.nih.gov/jpg/nlm:nlmuid-101430419-img", page_url: "https://collections.nlm.nih.gov/catalog/nlm:nlmuid-101430419-img", rights: "The National Library of Medicine believes this item to be in the public domain.", title: "Small Pox and Vaccination Hospital, London, England: Front view", date: "undated (19th c.)", note: "a hospital built just for smallpox"}   # LoC via Chrome
