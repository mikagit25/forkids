  - id: jenner
    chapter: "IV. The Milkmaid's Secret"
    date: "14 May 1796"
    narration: >
      In the English countryside, there was an old belief that milkmaids who caught cowpox, a mild disease from cows' udders, did not catch smallpox.
      A country doctor in Gloucestershire, Edward Jenner, decided to test it.
      On the fourteenth of May 1796, he took material from a cowpox sore on the hand of a milkmaid named Sarah Nelmes, and inoculated James Phipps, the eight-year-old son of his gardener. Sarah had caught cowpox from a cow named Blossom, whose hide still hangs on the wall of the library at St George's medical school in London.
      Weeks later, Jenner exposed the boy to smallpox. James did not fall ill.
      Jenner published his findings in 1798. The new method was named vaccination, from the Latin word vacca, meaning cow.
      Jenner was not the first to try it. In 1774, during an epidemic in Dorset, a farmer named Benjamin Jesty scratched material from an infected cow into the arms of his wife and their two eldest sons, using a darning needle. None of them caught smallpox. But Jesty was a farmer, not a doctor, and he never published. Jenner tested, recorded and campaigned, and that is why the world remembers his name.
