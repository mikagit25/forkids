  - id: balmis
    chapter: "VI. A Living Chain"
    date: "1803"
    narration: >
      There was a problem. Without refrigeration, the vaccine could not survive long sea voyages.
      In 1803, the Spanish Crown found an extraordinary solution. A doctor named Francisco Javier de Balmis sailed for the Americas with a group of orphan boys.
      Before departure, two boys were vaccinated. As the sores developed, material from them was used to vaccinate the next two, and so on, keeping the vaccine alive, child to child, across the Atlantic.
      There were twenty-two orphan boys, aged from three to ten. They were cared for on the voyage by Isabel Zendal, the director of their orphanage in A Coruña, who is remembered today as the first nurse ever to take part in an international health mission.
      Their ship, the María Pita, left A Coruña on the thirtieth of November 1803. In Venezuela the expedition split in two. Balmis's deputy, José Salvany, carried the vaccine south through the Andes for seven years, and died on the journey, in Cochabamba, in 1810. Balmis went on to Mexico, where he took on twenty-five more orphans to keep the vaccine alive across the Pacific to the Philippines. From there he sailed on to China, and on his way home in 1806 he stopped at the British island of Saint Helena and vaccinated its people, even though Spain and Britain were at war. Edward Jenner wrote: I don't imagine the annals of history furnish an example of philanthropy so noble, so extensive as this.
