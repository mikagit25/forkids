# Series: Biography of a Disease

title: "Smallpox: The Only Human Disease We Ever Wiped Out"
subtitle: "Three thousand years of the speckled monster, and how the world finally beat it"
slug: smallpox
language: en
era: [1700, 1980]        # engravings and photos from variolation to eradication
visual_context: "smallpox history vaccination"   # helps the relevance check
voice:
  backend: kokoro
  name: bf_emma
  lang: en-gb
  speed: 0.94
music:
  generate: true
  seed: 1796
  mood: hopeful

scenes:
  - id: cold-open
    montage: true          # fast cuts + one teaser photo from every chapter
    narration: >
      For thousands of years, one disease killed rich and poor, kings and children, on every inhabited continent.
      It killed roughly three in every ten people it infected, and left many survivors scarred or blind.
      People fought it with prayers, with red cloth, and with a dangerous trick learned from Asia and Africa: deliberately infecting the healthy.
      Then an English country doctor tried something stranger still, using a disease of cows.
      And in 1980, for the first and only time in history, the world declared a human disease eradicated.
      This is the biography of smallpox.
    images:
      - {query: "smallpox", count: 4}
      - {query: "smallpox vaccination", count: 2}
      - {query: "Edward Jenner", count: 1}

  - id: ancient
    chapter: "I. The Speckled Monster"
    narration: >
      Smallpox was caused by the variola virus, which spread from person to person through the air and through contact.
      After about two weeks of silent incubation came a high fever, then a rash that turned into deep, fluid-filled pustules, spreading over the face, arms and legs.
      Its origins are ancient. Rash-like scars on Egyptian mummies suggest that smallpox has existed for at least three thousand years, and the mummy of the pharaoh Ramses the Fifth is often cited as a possible early victim.
      Written descriptions of a smallpox-like disease appear in China in the fourth century, and in India by the seventh.
    images:
      - {query: "Ramses V mummy", count: 1}
      - {query: "smallpox patient", count: 2}
      - {query: "variola virus", count: 1, modern: true}

  - id: killer
    chapter: "II. A Killer of Kings"
    narration: >
      Smallpox shaped history.
      When Europeans arrived in the Americas, they brought smallpox with them. Indigenous peoples had never encountered it, and epidemics devastated the Aztec and Inca empires, helping a few hundred Spanish soldiers conquer them.
      In Europe, it struck royal families as easily as anyone. It killed a king of France, Louis the Fifteenth, in 1774, and an emperor of Austria, and changed the line of succession in several countries.
      In eighteenth-century Europe, it is estimated to have killed around four hundred thousand people every year.
    images:
      - {query: "Florentine Codex smallpox", count: 2}
      - {query: "Louis XV", count: 1}
      - {query: "smallpox 18th century", count: 1}

  - id: variolation
    chapter: "III. Fighting Fire with Fire"
    date: "1700s"
    narration: >
      Long before anyone understood viruses, people noticed that survivors of smallpox never caught it again.
      In China, India, the Ottoman Empire and parts of Africa, healers practised variolation: taking material from a smallpox sore and introducing it into a small cut on a healthy person, or blowing powdered scabs into the nose. Most people developed a milder case, and were protected for life.
      In 1721, Lady Mary Wortley Montagu, who had seen variolation in Constantinople and survived smallpox herself, had her daughter variolated in London. That same year in Boston, an enslaved African man named Onesimus told the minister Cotton Mather about the practice from his homeland, and it was tried during an epidemic there.
      Variolation worked, but it was risky. A few people died, and the variolated could spread the full disease to others.
    images:
      - {query: "Lady Mary Wortley Montagu", count: 2, colorize: true}
      - {query: "Cotton Mather", count: 1}
      - {query: "inoculation 18th century", count: 1}

  - id: jenner
    chapter: "IV. The Milkmaid's Secret"
    date: "14 May 1796"
    narration: >
      In the English countryside, there was an old belief that milkmaids who caught cowpox, a mild disease from cows' udders, did not catch smallpox.
      A country doctor in Gloucestershire, Edward Jenner, decided to test it.
      On the fourteenth of May 1796, he took material from a cowpox sore on the hand of a milkmaid named Sarah Nelmes, and inoculated James Phipps, the eight-year-old son of his gardener.
      Weeks later, Jenner exposed the boy to smallpox. James did not fall ill.
      Jenner published his findings in 1798. The new method was named vaccination, from the Latin word vacca, meaning cow.
    cards:                 # big-number cards, shown while the matching sentence is read
      - {big: "14 May 1796", text: "the first vaccination", match: "On the fourteenth of May 1796"}
    images:
      - {query: "Edward Jenner vaccination James Phipps", count: 2, colorize: true}
      - {query: "cowpox", count: 1}
      - {query: "Edward Jenner portrait", count: 1}

  - id: mockery
    chapter: "V. Cows and Cartoons"
    narration: >
      Not everyone was convinced. Some clergymen objected to infecting humans with animal disease. Critics warned that vaccinated people might start to look like cows.
      In 1802, the caricaturist James Gillray drew a famous cartoon showing Jenner vaccinating a crowd of frightened patients, with tiny cows bursting out of their arms and faces.
      But vaccination was far safer than variolation, and it spread rapidly. Jenner's work was translated into several languages within a few years. Bavaria made vaccination compulsory for army recruits in 1807.
    images:
      - {query: "Gillray Cow-Pock", count: 1}
      - {query: "anti-vaccination 19th century", count: 2}
      - {query: "vaccination 19th century", count: 1}

  - id: balmis
    chapter: "VI. A Living Chain"
    date: "1803"
    narration: >
      There was a problem. Without refrigeration, the vaccine could not survive long sea voyages.
      In 1803, the Spanish Crown found an extraordinary solution. A doctor named Francisco Javier de Balmis sailed for the Americas with a group of orphan boys.
      Before departure, two boys were vaccinated. As the sores developed, material from them was used to vaccinate the next two, and so on, keeping the vaccine alive, child to child, across the Atlantic.
      The expedition carried smallpox vaccination to Spanish America and on to the Philippines.
    images:
      - {query: "Balmis expedition", count: 2}
      - {query: "Francisco Javier de Balmis", count: 1}

  - id: century
    chapter: "VII. Still a Killer"
    narration: >
      Despite vaccination, smallpox remained one of the great killers of the twentieth century. Vaccination was uneven, especially in poorer countries, and outbreaks continued around the world.
      Historians estimate that smallpox killed around three hundred million people in the twentieth century alone.
      By the 1950s, wealthy countries had largely eliminated it at home. But as long as it existed anywhere, it could return anywhere.
    cards:
      - {big: "≈300 million", text: "deaths in the 20th century", match: "Historians estimate that smallpox killed"}
    images:
      - {query: "smallpox vaccination 1900s", count: 2}
      - {query: "smallpox hospital 1900s", count: 2}

  - id: eradication
    chapter: "VIII. The Last Campaign"
    date: "1967–1977"
    narration: >
      In 1967, the World Health Organization launched the Intensified Smallpox Eradication Programme.
      Teams spread across Africa, South Asia and South America. Instead of vaccinating everyone, they used a clever strategy called surveillance and containment: find every case, vaccinate everyone around it, and close the ring.
      A simple bifurcated needle, with two prongs, made vaccination quick and cheap, using a fraction of the vaccine.
      Country after country became free of the disease. In October 1977, in the town of Merca, in Somalia, a hospital cook named Ali Maow Maalin developed the last naturally occurring case of smallpox in the world. He survived.
    images:
      - {query: "smallpox eradication programme", count: 2, colorize: true}
      - {query: "bifurcated needle", count: 1}
      - {query: "Ali Maow Maalin", count: 1}

  - id: last-death
    chapter: "IX. The Last Victim"
    date: "1978"
    narration: >
      There was one more tragedy. In 1978, a medical photographer named Janet Parker, who worked at Birmingham University Medical School in England, caught smallpox from a laboratory in the building where the virus was being studied.
      She died, the last person known to have been killed by smallpox.
      On the eighth of May 1980, the World Health Assembly declared the world free of smallpox.
      It was the first, and is still the only, human disease ever eradicated.
    cards:
      - {big: "8 May 1980", text: "smallpox declared eradicated", match: "On the eighth of May 1980"}
    images:
      - {query: "smallpox eradication 1980", count: 2}
      - {query: "World Health Organization 1980", count: 1}

  - id: today
    chapter: "Epilogue"
    narration: >
      The virus still exists, but only in two high-security laboratories, one at the Centers for Disease Control in the United States and one at the VECTOR institute in Russia. Whether to destroy these last stocks is still debated.
      Smallpox vaccination ended around the world in the years after eradication. And Edward Jenner's idea, that the body can be trained to recognise a disease before it strikes, became the foundation of every vaccine we use today.
      If you enjoyed this biography of a disease, subscribe for the next one.
    images:
      - {query: "Edward Jenner statue", count: 1, modern: true}
      - {query: "smallpox", count: 1}

