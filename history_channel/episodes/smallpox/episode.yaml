  - id: killer
    chapter: "II. A Killer of Kings"
    narration: >
      Smallpox shaped history.
      When Europeans arrived in the Americas, they brought smallpox with them. Indigenous peoples had never encountered it, and epidemics devastated the Aztec and Inca empires, helping a few hundred Spanish soldiers conquer them.
      In 1520, smallpox swept through the Aztec capital, Tenochtitlan, and killed the new emperor, Cuitláhuac, after only eighty days on the throne. In the Andes, an epidemic, probably smallpox, killed the Inca ruler Huayna Capac and his chosen heir a few years later, and the civil war that followed left the empire divided just as Francisco Pizarro arrived.
      In Europe, it struck royal families as easily as anyone. It killed a king of France, Louis the Fifteenth, in 1774, and an emperor of Austria, and changed the line of succession in several countries.
      In England it killed Queen Mary the Second in 1694, at the age of thirty-two. In Russia it killed the fourteen-year-old Emperor Peter the Second in 1730, just before his wedding, and with him ended the male line of the Romanov dynasty.
      In eighteenth-century Europe, it is estimated to have killed around four hundred thousand people every year.
