  - id: eradication
    chapter: "VIII. The Last Campaign"
    date: "1967–1977"
    narration: >
      In 1967, the World Health Organization launched the Intensified Smallpox Eradication Programme.
      The idea had come from the Soviet Union. In 1958, its deputy minister of health, the virologist Viktor Zhdanov, asked the World Health Assembly to set out to wipe smallpox from the face of the Earth. The campaign that finally succeeded was directed by an American epidemiologist, Donald Henderson, at the height of the Cold War.
      Teams spread across Africa, South Asia and South America. Instead of vaccinating everyone, they used a clever strategy called surveillance and containment: find every case, vaccinate everyone around it, and close the ring. Health workers carried picture cards of a child covered in the rash from village to village, asking: have you seen anyone who looks like this? Rewards were offered for every case reported.
      A simple bifurcated needle, with two prongs, made vaccination quick and cheap, using a fraction of the vaccine. It had been invented in 1965 by an American microbiologist, Benjamin Rubin, from the eye of a sewing-machine needle, and it could be boiled and used again and again.
      Even Europe was not safe while the campaign went on. In 1972, a pilgrim returning to Kosovo from the Middle East brought smallpox home to Yugoslavia, and before doctors recognised it, it had spread as far as Belgrade. A hundred and seventy-five people fell ill and thirty-five died. Almost the entire population of eighteen million was vaccinated, and by May the outbreak was over.
      In October 1975, on Bhola Island in Bangladesh, a three-year-old girl named Rahima Banu became the last person in the world to catch the deadliest form of the disease, variola major. Her case was reported to the eradication team by an eight-year-old girl from her village. Rahima survived.
      Country after country became free of the disease. The last case in the Americas was in Brazil, in 1971. In October 1977, in the town of Merca, in Somalia, a hospital cook named Ali Maow Maalin developed the last naturally occurring case of smallpox in the world. He survived.
      Maalin later worked as a vaccinator himself. In 2013 he died of malaria, while helping a campaign to stop polio in Somalia.
