  - id: scream
    chapter: "X. A Blood-Red Sky"
    narration: >
      In Norway, the painter Edvard Munch wrote about a walk he once took at sunset. I was walking along the road with two friends. The sun was setting. Suddenly the sky turned blood red. I paused, feeling exhausted, and leaned on the fence. There was blood and tongues of fire above the blue-black fjord and the city. My friends walked on, and I stood there trembling with anxiety, and I sensed an infinite scream passing through nature.
      In 1893, Munch turned that memory into one of the most famous paintings in the world: The Scream.
      In 2004, an astronomer suggested that the blood-red sky Munch remembered may have been one of the Krakatoa sunsets, which coloured skies in many parts of the world for months in 1883 and 1884. Not everyone agrees. Other scholars think the colours came from Munch's own state of mind; his sister had been committed to an asylum nearby. But it is possible that the most famous scream in art began with a volcano on the other side of the world.
