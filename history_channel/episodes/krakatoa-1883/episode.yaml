  - id: explosions
    chapter: "IV. The Loudest Sound"
    date: "27 August 1883"
    narration: >
      On Monday the twenty-seventh of August came the great explosions.
      The first great explosion came at about half past five in the morning. The second followed at a quarter to seven. The third, at two minutes past ten, was the biggest of all.
      It was heard three thousand one hundred kilometres away in Perth, in Western Australia. On the island of Rodrigues, near Mauritius, nearly five thousand kilometres away, people thought it was cannon fire from a ship nearby. The sound had taken about four hours to travel there. It was the loudest sound ever measured, and one of the farthest that any sound has ever been heard.
      Closer to the volcano, the noise was overwhelming. On the British ship Norham Castle, about sixty kilometres away, sailors' eardrums burst. At the gasworks in Batavia, a hundred and sixty kilometres away, the pressure wave pushed the needle of a gauge off the scale. Windows shattered and walls cracked.
      Then the pressure wave kept going. Barographs, instruments that record air pressure, picked it up all over the world. Some recorded it seven times over five days, as the wave travelled to the far side of the Earth and back, again and again. It went around the planet three and a half times.
      Scientists have estimated the energy of the eruption at about two hundred megatons, roughly four times more powerful than the largest hydrogen bomb ever tested.
      At about twenty to eleven, much of what was left of the island collapsed into the emptied chamber of the volcano beneath it. Two thirds of Krakatoa had disappeared.
    candidates: ["barograph record Krakatoa", "Rodrigues island", "Perth 1883", "Norham Castle ship", "Batavia gasworks"]
