  - id: ashes
    chapter: "VI. The Burning Ashes"
    narration: >
      There was another killer. Clouds of incredibly hot gas, ash and pumice, called pyroclastic flows, poured down the sides of the volcano and raced across the sea on a cushion of steam. They travelled forty kilometres across the strait and reached the coast of Sumatra, where they burned villages and forests.
      Around noon, a rain of hot ash fell on the district of Ketimbang. It became known as the Burning Ashes of Ketimbang. About a thousand people died.
      One survivor, Mrs Beyerinck of Ketimbang, later described what happened in her house. Suddenly, it became pitch dark. The last thing I saw was the ash being pushed up through the cracks in the floorboards, like a fountain. She felt a heavy pressure throw her to the ground, and it seemed that all the air was being sucked away. She stumbled outside into the darkness, through hot ash that pricked like needles. Only later did she notice that her skin was hanging off in strips. I did not know I had been burnt, she said.
      On the island of Sebesi, north of the volcano, about three thousand people lived. There were no survivors.
    candidates: ["Sumatra village 1880s", "Lampung", "pumice", "volcanic ash", "Sebesi"]
    images:
