  - id: sky
    chapter: "IX. The Red Sunsets"
    narration: >
      The eruption had blasted ash and gas as high as eighty kilometres into the sky. High winds carried it around the whole planet.
      In the months that followed, people all over the world saw extraordinary sunsets: deep red, purple and gold, lasting long after the sun had gone down. In late 1883, the sky glowed so red that fire engines were called out in New York, Poughkeepsie and New Haven to fight what looked like enormous fires.
      In London, the painter William Ascroft regularly sketched the sky at sunset over Chelsea. He made more than five hundred colour sketches of the strange skies, at a time when there was no colour photography. In 2010, an astronomer recognised among them some of the earliest pictures of noctilucent clouds, glowing night clouds high in the atmosphere.
      For years, people reported a blue or even green moon, and lavender suns. Weather watchers tracked how the haze moved, and called it the equatorial smoke stream. It was the first identification of what we now call the jet stream.
      The haze also reflected sunlight back into space. In the year after the eruption, summers in the northern hemisphere were about four tenths of a degree cooler.
    candidates: ["Ascroft sunset sketch Krakatoa", "red sunset 1883", "Royal Society Krakatoa report 1888 plates", "Chelsea Thames 1880s"]
    images:
      - {query: "sunset painting 1883", count: 2}

  - id: scream
    chapter: "X. A Blood-Red Sky"
    narration: >
      In Norway, the painter Edvard Munch wrote about a walk he once took at sunset. I was walking along the road with two friends. The sun was setting. Suddenly the sky turned blood red. I paused, feeling exhausted, and leaned on the fence. There was blood and tongues of fire above the blue-black fjord and the city. My friends walked on, and I stood there trembling with anxiety, and I sensed an infinite scream passing through nature.
      In 1893, Munch turned that memory into one of the most famous paintings in the world: The Scream.
      In 2004, an astronomer suggested that the blood-red sky Munch remembered may have been one of the Krakatoa sunsets, which coloured skies in many parts of the world for months in 1883 and 1884. Not everyone agrees. Other scholars think the colours came from Munch's own state of mind; his sister had been committed to an asylum nearby. But it is possible that the most famous scream in art began with a volcano on the other side of the world.
    candidates: ["Munch The Scream", "Oslo fjord 1880s", "Kristiania 1880s"]
