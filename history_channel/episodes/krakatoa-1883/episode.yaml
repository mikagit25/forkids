  - id: aftermath
    chapter: "VII. After the Darkness"
    narration: >
      Darkness covered the strait until the twenty-ninth of August. When the light returned, the coastline was unrecognisable.
      The official death toll was thirty-six thousand four hundred and seventeen. According to the records of the Dutch colony, a hundred and sixty-five villages and towns had been destroyed, and a hundred and thirty-two more were badly damaged.
      Two weeks after the eruption, an observer described the site of one village: Thousands of corpses of human beings and also carcasses of animals still await burial, and make their presence apparent by the indescribable stench.
      Huge rafts of floating pumice drifted across the Indian Ocean for months. On some of them were human skeletons, and some washed up on the east coast of Africa, up to a year after the eruption.
      A stretch of the coast of western Java was never resettled. The jungle grew back over it. Today it is the Ujung Kulon National Park, a World Heritage site and the last home of the rare Javan rhinoceros.
      And Krakatoa itself was gone. Only the southern third of the island remained, the half-cone of Rakata, cut off by a cliff two hundred and fifty metres high. Where the rest of the island had stood, the sea was now two to three hundred metres deep.
    candidates: ["Krakatoa after eruption 1883", "Rakata cliff", "Ujung Kulon", "Javan rhinoceros", "pumice raft"]
