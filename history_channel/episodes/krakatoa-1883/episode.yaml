  - id: sky
    chapter: "IX. The Red Sunsets"
    narration: >
      The eruption had blasted ash and gas as high as eighty kilometres into the sky. High winds carried it around the whole planet.
      In the months that followed, people all over the world saw extraordinary sunsets: deep red, purple and gold, lasting long after the sun had gone down. In late 1883, the sky glowed so red that fire engines were called out in New York, Poughkeepsie and New Haven to fight what looked like enormous fires.
      In London, the painter William Ascroft regularly sketched the sky at sunset over Chelsea. He made more than five hundred colour sketches of the strange skies, at a time when there was no colour photography. In 2010, an astronomer recognised among them some of the earliest pictures of noctilucent clouds, glowing night clouds high in the atmosphere.
      For years, people reported a blue or even green moon, and lavender suns. Weather watchers tracked how the haze moved, and called it the equatorial smoke stream. It was the first identification of what we now call the jet stream.
      The haze also reflected sunlight back into space. In the year after the eruption, summers in the northern hemisphere were about four tenths of a degree cooler.
