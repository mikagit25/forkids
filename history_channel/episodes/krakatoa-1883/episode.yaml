  - id: climax
    chapter: "III. Sunday, the Twenty-Sixth"
    date: "26 August 1883"
    narration: >
      On Sunday the twenty-sixth of August, at about one o'clock in the afternoon, the eruption entered its final, violent phase.
      By two o'clock, a black cloud of ash stood twenty-seven kilometres high. The explosions came every ten minutes, then almost without stopping. By five in the afternoon they could be heard all over Java.
      Ships in the strait were caught in the darkness. Within twenty kilometres of the volcano, pieces of hot pumice as big as a fist rained down on their decks. Waves about a metre high began to batter the coasts of Java and Sumatra, and they went on all night. Between seven and eight in the evening, a small tsunami struck the shore forty kilometres away.
      Nobody knew what was coming in the morning.
