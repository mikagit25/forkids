  - id: child
    chapter: "XI. The Child of Krakatoa"
    narration: >
      For more than forty years, the sea over the old volcano was quiet. Then, in early 1927, signs of volcanic activity appeared in the middle of the caldera, between where the cones of Perboewatan and Danan had once stood.
      On the twenty-ninth of December 1927, a new island broke the surface. Waves washed it away. It appeared again, and was washed away again. Finally, on the eleventh of August 1930, it rose permanently above the sea. It was named Anak Krakatau, the child of Krakatoa.
      The child kept growing, eruption by eruption, until it was more than three hundred metres high. In 2012, volcanologists warned that its steep side could one day collapse into the sea and cause a tsunami.
      On the twenty-second of December 2018, during an eruption, a large part of Anak Krakatau slid into the sea. Waves up to five metres high struck the coasts of Java and Sumatra at night, with no warning, during the holiday season. More than four hundred people died, in some of the same places struck in 1883. After the disaster, Indonesia installed new early-warning systems along the coasts.
