  - id: news
    chapter: "VIII. News Travels Fast"
    narration: >
      In earlier centuries, news of a disaster like this would have taken weeks or months to reach Europe. But by 1883, telegraph cables connected Java to the rest of the world. The news of Krakatoa spread faster than the news of any earlier disaster, even faster than the news of the assassination of Abraham Lincoln.
      Within days, the story was in newspapers around the world. It was one of the first truly global news events.
      In the Dutch East Indies, the government asked Rogier Verbeek, the geologist who had studied the island three years earlier, to investigate. Verbeek had lived through the eruption himself at his home in Buitenzorg, on Java. On the orders of the Governor-General, he investigated the eruption, and in 1884 and 1885 published a detailed study of the eruption. It helped to make volcanology a modern science.
