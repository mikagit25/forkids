  - id: island
    chapter: "I. The Island in the Strait"
    narration: >
      Krakatoa lay in the Sunda Strait, the narrow sea between the islands of Java and Sumatra, in what was then the Dutch East Indies and is today Indonesia.
      The strait was one of the great shipping lanes of the world. For centuries, ships had used it as the gateway to the Spice Islands, and on the coast of Java, facing the strait, stood the busy port of Anjer.
      The island itself was green and quiet. It had three volcanic cones joined together: Rakata, the highest, about eight hundred metres tall, in the south; Danan in the centre; and the low cone of Perboewatan in the north.
      It had erupted before. In 1681, a Dutch mining engineer named Johann Wilhelm Vogel sailed past and wrote that the island had erupted the previous year, in May 1680. After that, it slept for two centuries.
      In 1880, a Dutch geologist, Rogier Verbeek, studied the island and examined a lava flow on Perboewatan. In the years before 1883 there were strong earthquakes in the region; one of them, in 1880, damaged a lighthouse. Few people paid much attention.
