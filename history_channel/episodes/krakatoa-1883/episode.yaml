  - id: closing
    chapter: "Epilogue"
    narration: >
      Krakatoa was not the largest eruption in history. But it was the first great natural disaster that the whole world experienced almost at once: by telegraph, in its newspapers, in the sound that crossed the oceans, in the needles of its barographs, and in its own blood-red evening skies.
      Today, the remains of the old island, Rakata, Sertung and Panjang, ring the caldera, and in the middle, the child of Krakatoa is still active. Many people live on the coasts around the Sunda Strait, within reach of its waves.
      If you enjoyed this story from the archives, subscribe for more.
