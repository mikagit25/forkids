  - id: awakening
    chapter: "II. The Awakening"
    date: "May – August 1883"
    narration: >
      On the twentieth of May 1883, Perboewatan woke up. Steam and ash rose about six kilometres into the sky. The explosions could be heard in Batavia, the colonial capital, a hundred and sixty kilometres away, where they rattled windows and doors.
      The colonial authorities were curious rather than afraid. On the twenty-sixth of May, an excursion party was sent out to the island to have a look. They found the island covered in fine white dust, and watched Perboewatan explode every five to ten minutes, throwing out pumice.
      Then the eruption seemed to calm down. But in the middle of June there were loud explosions again, and a thick black cloud covered the islands for five days. When the wind cleared it, people saw that the summit of Perboewatan was gone. New vents had opened. The sea around the island rose and fell so strangely that ships at anchor had to be moored with chains.
      In early August, a Dutch army topographer, Captain Ferzenaar, landed on Krakatoa to map it. He counted three large columns of ash and at least eleven other vents giving off steam. The ash on the ground was half a metre thick, and every tree had been destroyed, leaving only stumps. He advised that nobody should land there again.
    candidates: ["Krakatoa May 1883 photograph", "volcano steam eruption 19th century", "Dutch East Indies steamer", "Batavia harbour"]
