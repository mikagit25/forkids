  - id: waves
    chapter: "V. The Waves"
    narration: >
      The explosions themselves killed few people. The sea killed tens of thousands.
      As huge masses of hot ash and rock fell back into the strait, they pushed the water outwards in a series of giant waves. The largest followed the third explosion. At Merak, on the north-western tip of Java, the wave was estimated at forty-six metres high, as tall as a fifteen-storey building. The town was destroyed. Along the west coast of Java the waves reached more than forty metres, and along the south coast of Sumatra more than twenty.
      The port of Anjer, where so many ships had stopped for supplies, was wiped out.
      Across the strait, the steamer Loudon was anchored near the town of Telok Betong, in Sumatra. Its passengers saw a gigantic wave of prodigious height advancing toward the seashore. The crew turned the ship to face it, and the Loudon was lifted up with dizzying speed, rode over the crest and down the other side. Then, the passengers wrote, they watched as the sea in a single sweeping motion consumed the town. There, where an instant before had lain the town of Telok Betong, nothing remained but the open sea.
      A farm worker near Merak remembered seeing a great black thing, a long way off, coming towards us. It was very high and very strong, and we soon saw that it was water. People ran for a steep hillside. There was a terrible crush at the one place where they could climb, and the water came too fast for most of them. You can see the marks on the hillside, he said, where the fight for life took place.
      Some eighty kilometres away, the low Thousand Islands off Batavia were covered by two metres of water, and people climbed trees to survive. The waves crossed the Indian Ocean; one person was killed in Ceylon, and ships as far as South Africa were rocked. Small waves even showed up on tide gauges in the English Channel.
    candidates: ["tsunami 1883 lithograph", "Telok Betong", "Merak", "Anjer destroyed", "Loudon steamer", "Thousand Islands Batavia"]
