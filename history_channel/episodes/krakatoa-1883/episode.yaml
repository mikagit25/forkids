  - id: cold-open
    montage: true
    narration: >
      At two minutes past ten on the morning of the twenty-seventh of August 1883, a volcano in the Dutch East Indies made the loudest sound in recorded history.
      It was heard in Australia, more than three thousand kilometres away. On a small island in the Indian Ocean, nearly five thousand kilometres away, people thought it was the guns of a ship in distress.
      The pressure wave went around the whole Earth three and a half times. Waves more than thirty metres high swept away towns and villages. At least thirty-six thousand people died.
      For months afterwards, sunsets around the world glowed so red that fire brigades in New York were called out to fight fires that did not exist.
      This is the story of Krakatoa.
