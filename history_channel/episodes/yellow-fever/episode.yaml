  - id: today
    chapter: "Epilogue"
    narration: >
      Yellow fever has not been defeated. It still circulates in parts of Africa and South America, and causes tens of thousands of deaths in some years, mostly where vaccination coverage is low. Around six hundred million people live in areas where the disease is found. The World Health Organization estimates around two hundred thousand cases a year, about nine in ten of them in Africa. In 2017, an outbreak in Brazil moved toward the crowded Atlantic coast, where most people had not been vaccinated.
      Travellers to these regions are often required to show proof of vaccination, the famous yellow card.
      The story of yellow fever is the story of how science learned that the most dangerous creature in history is not a tiger or a shark, but the mosquito.
      If you enjoyed this biography of a disease, subscribe for the next one.
    candidates: ["yellow fever vaccination Africa", "International Certificate of Vaccination yellow fever", "Aedes aegypti mosquito", "yellow fever vaccine vial"]
