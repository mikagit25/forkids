  - id: canal
    chapter: "VIII. The Canal"
    date: "1914"
    narration: >
      Without yellow fever, the canal could be built.
      Tens of thousands of workers dug through mountains, built enormous locks and dammed a river to create a lake. At the peak of construction, some forty thousand people worked on the canal, and more than a hundred steam shovels cut through the mountains at Culebra. Yellow fever was gone, but the work was still deadly: about five thousand six hundred workers died of disease and accidents during the American construction, most of them labourers from the West Indies, especially from Barbados. On the fifteenth of August 1914, the steamship Ancon made the first official passage, and the Panama Canal opened, linking the Atlantic and the Pacific. The First World War had begun only days before, and the grand celebrations that had been planned were cancelled.
      It was one of the greatest engineering projects in history. And it was, in part, a victory of medicine over a mosquito.
