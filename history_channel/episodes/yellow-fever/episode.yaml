summary: >
  In 1793 yellow fever emptied Philadelphia, then the capital of the United States. In 1802 it destroyed Napoleon's army in
  Saint-Domingue and helped Haiti win its independence. It buried some twenty-two thousand workers on the French attempt to
  dig a canal across Panama. For a century doctors blamed filth and bedding, until a Cuban physician, Carlos Finlay, blamed
  a mosquito, and Walter Reed's commission proved him right in Cuba in 1900, at the cost of volunteers' lives, among them
  Jesse Lazear and the nurse Clara Maass. This is the biography of yellow fever: from Bush Hill and the Free African
  Society, through Memphis in 1878, to William Gorgas's war on the mosquito, the Panama Canal and Max Theiler's 17D vaccine.

