  - id: philadelphia
    chapter: "II. Philadelphia, 1793"
    date: "1793"
    narration: >
      In the summer of 1793, Philadelphia was the capital of the United States and its largest city.
      That August, yellow fever broke out near the docks. Within weeks it was everywhere.
      Around twenty thousand people fled the city, including President George Washington and much of the federal government. Those who stayed watched carts carry the dead through empty streets. People walked with handkerchiefs soaked in vinegar pressed to their noses. In the worst week, in early October, seven hundred and eleven deaths were reported.
      The mayor, Matthew Clarkson, stayed, and with a small committee of volunteers he turned a mansion outside the city, Bush Hill, into a fever hospital. At first it was a place of horror, described by one witness as a great human slaughter-house. Then a French-born merchant, Stephen Girard, and a barrel maker, Peter Helm, volunteered to run it themselves. They cleaned it, brought in beds and clean water, and hired nurses.
      The city also asked for help from the Free African Society, founded by two Black ministers, Richard Allen and Absalom Jones. Benjamin Rush believed, wrongly, that people of African descent were immune. They were not. Black volunteers nursed the sick and carried away the dead, and two hundred and forty Black Philadelphians died, at the same rate as white residents. When a publisher, Mathew Carey, later accused some Black nurses of overcharging, Allen and Jones answered with a pamphlet of their own, defending their community.
      Doctors disagreed bitterly about treatment. Benjamin Rush, the most famous physician in America, bled his patients heavily and gave them powerful purges. Others prescribed rest and gentle care.
      By the time cold weather arrived in November and the epidemic ended, around five thousand people had died, about one in ten of the city's population.
    cards:                 # big-number cards, shown while the matching sentence is read
      - {big: "1 in 10", text: "Philadelphians died in 1793", match: "By the time cold weather arrived"}
