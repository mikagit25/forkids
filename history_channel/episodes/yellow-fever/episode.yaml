  - id: theories
    chapter: "IV. Filth, Fomites and a Cuban Doctor"
    narration: >
      Through the nineteenth century, yellow fever struck again and again, from New Orleans to Rio de Janeiro. At least twenty-five major outbreaks struck the Americas in the eighteenth and nineteenth centuries, and New Orleans was hit again and again, worst of all in 1833 and 1853.
      Most doctors believed it spread through filth and miasma, or through the clothes and bedding of the sick. Cities burned tar in the streets and fumigated houses.
      In 1878, an epidemic swept up the Mississippi Valley and killed an estimated twenty thousand people. In Memphis alone, more than five thousand died, and so many people fled that the city lost its charter. Doctors, priests, nuns, and even the owner of a brothel, Annie Cook, stayed behind to nurse the sick, and many of them died. A riverboat carrying people away from Memphis wandered the Mississippi for two months, because no town would let its passengers come ashore.
      In 1881, a Cuban physician named Carlos Finlay proposed a different idea. He argued that yellow fever was carried by a mosquito, which bit a sick person and then a healthy one. He presented the idea at an international sanitary conference, where it was received with ridicule. A year later he identified the culprit, the mosquito we now call Aedes aegypti. For almost twenty years, few people took him seriously. Finlay was nominated for the Nobel Prize seven times, but never received it.
