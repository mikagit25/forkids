  - id: disease
    chapter: "I. Yellow Jack"
    narration: >
      Yellow fever is caused by a virus, carried by mosquitoes, above all the species Aedes aegypti.
      It begins like many fevers, with chills, headache and muscle pain. Most patients recover. But about fifteen in every hundred go on to a severe form of the disease. But in some, after a brief remission, the disease returns violently. The liver fails, turning the skin and eyes yellow. Patients bleed from the gums and stomach, and vomit dark, digested blood, the dreaded black vomit.
      The virus and its mosquito originally came from Africa. They crossed the Atlantic on slave ships in the seventeenth century, carried in water barrels where mosquitoes bred. The first outbreak in the Americas that can be identified with certainty struck the island of Barbados in 1647. A year later, on the Yucatán Peninsula, the Maya gave the illness a name of their own: xekik, blood vomit. In the ports of the Americas, the disease found a new home.
      Sailors called it Yellow Jack, after the yellow quarantine flag flown by ships carrying the sick.
