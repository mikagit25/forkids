  - id: camp
    chapter: "VI. Proof"
    narration: >
      To be certain, the commission built an experimental station near Havana, named Camp Lazear in honour of their friend, and ran a careful series of experiments.
      In one building, volunteers slept for weeks among the soiled bedding and clothing of yellow fever patients. None of them caught the disease.
      In another, clean and well-ventilated, volunteers were exposed only to infected mosquitoes. They fell ill.
      For the second phase of testing, volunteers signed written consent forms, among the earliest in medical research, acknowledging that they might die.
      The conclusion was clear. Yellow fever was not spread by filth or bedding. It was spread by mosquitoes.
      The experiments did not end there. In 1901, in Havana, further tests were made on volunteers who were paid one hundred dollars, and another hundred if they fell ill. One of them was a twenty-five-year-old American nurse, Clara Maass. She was bitten seven times. After the last bite, in August 1901, she developed yellow fever, and she died on the twenty-fourth of August. Her death caused a public outcry, and experiments on human volunteers with yellow fever came to an end.
      Walter Reed did not live long to enjoy his fame. In November 1902, he died of a ruptured appendix, at the age of fifty-one.
    images:
      - {query: "Camp Lazear", count: 2}
      - {query: "yellow fever experiment Cuba 1900", count: 2}
      - {file: "web:nlm:101405772", image: "https://collections.nlm.nih.gov/jpg/nlm:nlmuid-101405772-img", page_url: "https://collections.nlm.nih.gov/catalog/nlm:nlmuid-101405772-img", rights: "The National Library of Medicine believes this item to be in the public domain.", title: "U.S. War of 1898 - Medical and Sanitary Affairs: General view of Camp Lazear (?) near Quemados", date: "1900", note: "the experimental camp in Cuba (NLM marks the identification with a question mark)"}   # LoC via Chrome

  - id: gorgas
    chapter: "VII. War on the Mosquito"
    date: "1901–1906"
    narration: >
      If mosquitoes were the problem, mosquitoes could be fought. In Havana, the army doctor William Gorgas launched a campaign against them in 1901. Gorgas knew the disease personally. Years earlier, at an army post in Texas, he had caught yellow fever while caring for a patient, a young woman named Marie Doughty. Both survived, immune for life, and later they married. Water containers were covered, breeding sites destroyed, and houses fumigated by burning pyrethrum powder. Within about a year, the number of cases in Havana fell from hundreds to none.
      Then Gorgas went to Panama. Two decades earlier, a French company led by Ferdinand de Lesseps, the builder of the Suez Canal, had tried to dig a canal there. Between 1881 and 1889, an estimated twenty-two thousand of its workers died, mostly of yellow fever and malaria. At its peak, in 1888, the French company employed around forty thousand workers, most of them from the islands of the West Indies. One chief engineer, Jules Dingler, lost his entire family to yellow fever and resigned. In 1889 the company went bankrupt, and the savings of some eight hundred thousand investors were lost.
      Now the Americans were trying again. Gorgas led about four thousand workers in a war on mosquitoes: draining standing water, spreading oil on ponds, and putting screens on windows. By December 1905, deaths from yellow fever among canal workers had stopped. In 1914, Gorgas became Surgeon General of the United States Army.
