  - id: haiti
    chapter: "III. Napoleon's Lost Army"
    date: "1802–1803"
    narration: >
      In 1802, Napoleon sent a large army to the Caribbean colony of Saint-Domingue, today's Haiti, to crush the revolution of formerly enslaved people and restore French control.
      The army fought the Haitian revolutionaries. But it was also attacked by yellow fever. By one account, around fifteen thousand French soldiers died of fever in only two months. Tens of thousands died in all, from war and disease, among them the expedition's commander, Napoleon's brother-in-law, General Leclerc. He had taken refuge on the small island of Tortuga to escape the fever, but it found him there, and he died on the first of November 1802. His wife, Pauline Bonaparte, cut off her hair and laid it in his coffin.
      The revolution's great leader, Toussaint Louverture, had been arrested by the French and shipped to a fortress prison in the mountains of France, where he died in 1803. But his generals fought on. On the eighteenth of November 1803, Jean-Jacques Dessalines defeated the French at the Battle of Vertières, and by the end of the year the last French soldiers had left.
      The disaster helped convince Napoleon to give up his ambitions in the Americas. In 1803, he sold the vast Louisiana territory to the United States, for fifteen million dollars, less than three cents an acre.
      And on the first of January 1804, Haiti declared its independence, the first nation founded by formerly enslaved people.
