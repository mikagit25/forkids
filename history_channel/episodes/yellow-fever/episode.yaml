  - id: gorgas
    chapter: "VII. War on the Mosquito"
    date: "1901–1906"
    narration: >
      If mosquitoes were the problem, mosquitoes could be fought. In Havana, the army doctor William Gorgas launched a campaign against them in 1901. Gorgas knew the disease personally. Years earlier, at an army post in Texas, he had caught yellow fever while caring for a patient, a young woman named Marie Doughty. Both survived, immune for life, and later they married. Water containers were covered, breeding sites destroyed, and houses fumigated by burning pyrethrum powder. Within about a year, the number of cases in Havana fell from hundreds to none.
      Then Gorgas went to Panama. Two decades earlier, a French company led by Ferdinand de Lesseps, the builder of the Suez Canal, had tried to dig a canal there. Between 1881 and 1889, an estimated twenty-two thousand of its workers died, mostly of yellow fever and malaria. At its peak, in 1888, the French company employed around forty thousand workers, most of them from the islands of the West Indies. One chief engineer, Jules Dingler, lost his entire family to yellow fever and resigned. In 1889 the company went bankrupt, and the savings of some eight hundred thousand investors were lost.
      Now the Americans were trying again. Gorgas led about four thousand workers in a war on mosquitoes: draining standing water, spreading oil on ponds, and putting screens on windows. By December 1905, deaths from yellow fever among canal workers had stopped. In 1914, Gorgas became Surgeon General of the United States Army.
