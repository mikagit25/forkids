  - id: vaccine
    chapter: "IX. The Vaccine"
    date: "1937"
    narration: >
      Mosquito control worked in cities, but yellow fever also lived in monkeys in the jungles of Africa and South America, so it could never be wiped out that way.
      In 1927, scientists isolated the yellow fever virus in West Africa. Ten years later, in 1937, the South African virologist Max Theiler, working at the Rockefeller Foundation in New York, developed a vaccine called 17D. With his colleague Hugh Smith, he weakened the virus by growing it again and again, more than a hundred times, in chicken embryos, until it no longer caused disease. Between 1940 and 1947 the Rockefeller Foundation produced more than twenty-eight million doses. A single dose gives protection for life. It is still used today.
      Theiler received the Nobel Prize in Physiology or Medicine in 1951, the first Nobel laureate born in Africa.
    images:
