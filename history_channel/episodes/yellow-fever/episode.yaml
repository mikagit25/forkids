  - id: reed
    chapter: "V. The Reed Commission"
    date: "1900"
    narration: >
      In 1900, after the Spanish-American War, yellow fever was killing American soldiers in Cuba. The US Army sent a commission led by Major Walter Reed to find out why.
      The commission decided to test Finlay's mosquito theory, on human volunteers.
      On the thirty-first of August 1900, Dr Jesse Lazear allowed a mosquito that had fed on yellow fever patients to bite a soldier, Private William Dean. Within days, Dean fell ill. He survived.
      Another member of the commission, James Carroll, also fell gravely ill after a mosquito bite. He recovered, but the illness damaged his heart, and he died seven years later.
      Lazear himself was less lucky. On the eighth of September, he wrote to his wife: I rather think I am on the track of the real germ. Days later he fell ill, and on the twenty-fifth of September 1900 he died, at the age of thirty-four, leaving a wife and two small children. For decades the official story was that a stray mosquito had bitten him by accident. In 1947, his own notebook revealed the truth: he had let an infected mosquito bite him on purpose.
    candidates: ["Walter Reed", "James Carroll yellow fever", "Jesse William Lazear", "Aristides Agramonte", "Columbia Barracks Cuba", "Havana 1900"]
