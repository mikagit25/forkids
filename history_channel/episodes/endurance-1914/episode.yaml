  - id: cold-open
    speed: 1.0             # RULES: cold-open <= 30 s, a bit faster
    montage: true          # fast cuts + one teaser photo from every chapter
    narration: >
      In 1914, twenty-eight men sailed south to cross Antarctica on foot.
      They never set foot on the continent. The ice crushed their ship and dragged her to the bottom of the sea.
      For five months they lived on floating ice. Six of them crossed eight hundred miles of the worst ocean on Earth in a lifeboat.
      Nobody in the world knew where they were. And every one of them came home.
    images:
