  - id: romantic
    chapter: "IV. The Romantic Disease"
    narration: >
      Strangely, the nineteenth century also romanticised consumption.
      Because it often struck young people, and slowly made them thin, pale and flushed, it became associated with sensitivity, beauty and artistic genius. Some fashionable women even tried to look consumptive.
      Lord Byron wrote that he should like to die of consumption. Novels made heroines of consumptive young women, and two of the most famous operas ever written followed them: in Verdi's La Traviata and Puccini's La Bohème, the heroine dies of consumption in the final act.
      The disease took a long list of artists and writers. The composer Frédéric Chopin suffered from chronic lung disease for years, almost certainly tuberculosis, and his letters and the writings of George Sand describe his coughing fits. The poet John Keats, who had trained as a doctor, recognised his own blood on a pillow and knew what it meant.
      He died in Rome in 1821, at the age of twenty-five. Edgar Allan Poe watched his young wife, Virginia, waste away for five years after she first coughed blood while singing at the piano. She died of tuberculosis in 1847, at twenty-four.
      In Norway, the painter Edvard Munch lost his older sister Sophie to tuberculosis when she was fifteen, and for more than forty years he painted her deathbed again and again. Anton Chekhov, himself a doctor, coughed blood for years and hid it from his family; he died of tuberculosis in 1904. Franz Kafka died of it in 1924, at forty, after years in sanatoriums.
      The reality was far from romantic. Most victims were poor, and died in misery.
