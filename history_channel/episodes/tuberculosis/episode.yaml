  - id: sanatorium
    chapter: "VII. The Sanatorium"
    date: "1854–1950"
    narration: >
      Without a cure, doctors turned to rest and fresh air.
      In 1854, Hermann Brehmer opened a sanatorium in the mountains of Silesia, in Görbersdorf. In America, a young New York doctor, Edward Trudeau, was diagnosed with tuberculosis in 1873. He went to the Adirondack mountains expecting to die there, and instead grew stronger. In 1884 he opened a sanatorium at Saranac Lake, starting with a single small cottage called Little Red.
      The village of Saranac Lake grew from about three hundred people into a little town of eight thousand, its houses built with porches where patients took the cure.
      Soon there were sanatoriums across Europe and America. Patients lay for hours on open verandas, wrapped in blankets, even in winter. They ate rich food, took their temperature several times a day, and followed strict rules.
      Some recovered. Many did not.
      High in the Swiss Alps, the village of Davos, modelled on Brehmer's sanatorium, became a world-famous resort for the sick. The writer Robert Louis Stevenson spent the winter of 1880 there, and Thomas Mann set his novel The Magic Mountain in a Davos sanatorium, where patients wait for years, measuring their days by the thermometer.
      Surgeons tried more drastic treatments. They deliberately collapsed an infected lung, injecting air into the chest to let it rest and heal, a method pioneered by the Italian physician Carlo Forlanini. But sanatoriums also separated the sick from their families, which helped slow the spread of the disease.
