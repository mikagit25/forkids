  - id: today
    chapter: "X. Not Gone"
    narration: >
      In wealthy countries, tuberculosis came to seem like a disease of the past. It was not.
      In 1993, the World Health Organization declared tuberculosis a global health emergency. HIV, which weakens the immune system, had fuelled a new wave of cases, and drug-resistant strains were spreading.
      In 2024, more than ten million people fell ill with tuberculosis, and about one point two million died. It is once again the world's deadliest infectious disease. About a quarter of all people alive today carry the bacterium in a dormant form. Most of them live in poorer countries, and most of these deaths are preventable with drugs that already exist.
      Ordinary tuberculosis can be cured with a combination of pills taken every day for about six months. The hardest part is not the medicine, but reaching every patient, and making sure no one stops the treatment halfway.
      Multidrug-resistant tuberculosis, which does not respond to the main medicines, remains one of the greatest threats in global health.
