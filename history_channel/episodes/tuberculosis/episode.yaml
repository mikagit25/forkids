  - id: vampire
    chapter: "III. The Vampire of Exeter"
    date: "1892"
    narration: >
      Fear of the disease produced stranger beliefs too. In rural New England, when consumption killed one member of a family after another, some people believed that a dead relative was draining the life from the living.
      In the farming town of Exeter, Rhode Island, George Brown lost his wife in 1883, and then his eldest daughter, Mary Olive. In 1891, his daughter Mercy and his only son, Edwin, fell ill as well. Mercy died.
      Neighbours persuaded George Brown to let them dig up the bodies. On the seventeenth of March 1892, with a local doctor and a newspaper reporter watching, they opened the graves.
      Mercy's heart and liver were burned, and the ashes were mixed with water and given to Edwin to drink, as a cure. He died two months later.
      Newspapers reported the story, and some historians think it may have reached Bram Stoker while he was writing Dracula.
