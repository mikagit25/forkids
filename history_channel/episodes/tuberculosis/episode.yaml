    narration: >
      It has been found in human bones nine thousand years old.
      In the nineteenth century, it killed about a quarter of Europe's adults, and people thought it made its victims beautiful.
      Families dug up their dead, convinced a vampire was to blame.
      Then, in 1944, a young American scientist found the first cure.
      And yet today, tuberculosis still kills more people than any other infection on Earth.
