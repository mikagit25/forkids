  - id: koch
    chapter: "VI. Koch's Discovery"
    date: "24 March 1882"
    narration: >
      For centuries, many doctors believed tuberculosis was hereditary, or caused by a weak constitution.
      On the twenty-fourth of March 1882, in Berlin, the German physician Robert Koch stood before the Physiological Society and announced that he had found its cause: a bacterium, which he had managed to stain and see under the microscope, and to grow in the laboratory.
      It was a turning point in medicine. Tuberculosis was infectious. It could be prevented.
      Koch had already shown that a bacterium caused anthrax, and he would go on to identify the bacterium of cholera.
      Eight years later Koch announced something even bigger: a remedy, which he called tuberculin. Patients flocked to Berlin. But tuberculin did not cure anyone, and the scandal damaged his reputation. It found its real use later, as a skin test that shows whether a person has been infected. In 1905, Koch received the Nobel Prize for his work on tuberculosis.
      Today, the twenty-fourth of March is World Tuberculosis Day.
