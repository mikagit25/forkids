- id: handcuff-king
  chapter: Chapter 2
  title: The Handcuff King
  narration: 'In 1899, Houdini met the theatre manager Martin Beck in Saint Paul, Minnesota. Beck told him to forget the card tricks and to concentrate on escapes, and he booked him on the Orpheum vaudeville
    circuit. Within months, Houdini was playing the best theatres in America. In 1900, Beck sent him to Europe. In London, Houdini went to Scotland Yard and escaped from police handcuffs in front of the
    detectives. The Alhambra Theatre booked him for six months. In Germany, the police suspected that his act was a fraud. In Berlin, he was stripped naked and locked in thumbscrews, finger locks and irons
    in front of three hundred policemen. He was free in six minutes. In Cologne, a newspaper and a policeman accused him of cheating. Houdini sued them. In court, he was asked to open the policeman''s own
    lock without any tools. He did, and he won the case. Everywhere he went, he challenged the local police to lock him up. Billed as the Handcuff King, he became a star in Britain, Germany, France and
    Russia.

    '
