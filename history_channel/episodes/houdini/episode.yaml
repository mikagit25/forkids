- id: mirror
  title: The Mirror Challenge
  narration: 'His most famous handcuff escape took place in London, on the seventeenth of March 1904. The Daily Mirror newspaper challenged him to escape from a special pair of handcuffs that, it said,
    had taken a Birmingham locksmith five years to make. Some four thousand people and more than a hundred journalists filled the Hippodrome theatre. Houdini went behind a small screen, his ghost house.
    Time passed. He came out several times, sweating. He asked for the cuffs to be taken off so that he could remove his coat. The newspaper''s man refused. So Houdini took a penknife in his teeth and cut
    his coat off his body. After an hour and ten minutes, he walked out free. The crowd carried him on their shoulders, and he broke down and wept. To this day, nobody knows exactly how he did it. Some
    biographers believe the whole struggle was arranged in advance, as pure showmanship. If so, it was the best show in town.

    '
