- id: death
  title: Halloween
  narration: 'In October 1926, Houdini was on tour in Canada. On the twenty second, in his dressing room at the Princess Theatre in Montreal, a student asked if it was true that punches to his stomach did
    not hurt him. Houdini, lying on a couch with a broken ankle, said his stomach could take a lot. The student hit him several times, hard, before he could prepare. That night Houdini performed in great
    pain. For two days he did not see a doctor. When he did, he had a high fever and acute appendicitis, and he was told to have an operation at once. He went on with the show. On the twenty fourth of October,
    at the Garrick Theater in Detroit, he took the stage with a fever of forty degrees. It was his last performance. Harry Houdini died in Detroit on the thirty first of October 1926, on Halloween, of peritonitis.
    He was fifty two. Whether the punches caused his death, nobody can say for certain.

    '
