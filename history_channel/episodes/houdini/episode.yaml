- id: coffin
  chapter: Chapter 6
  title: Ninety Minutes Under Water
  narration: 'In 1926, an Egyptian performer called Rahman Bey claimed that supernatural powers let him stay in a sealed coffin for an hour. Houdini answered without any supernatural powers. On the fifth
    of August 1926, he was sealed in a coffin and lowered into the swimming pool of the Hotel Shelton in New York. He stayed there for an hour and a half. He was fifty two years old. Years earlier, near
    Santa Ana in California, he had tried being buried alive in a pit of earth six feet deep, with no coffin at all, and had almost died clawing his way out. Now he wanted to prove that anyone with the
    right training could survive what the fakirs called a miracle.

    '
