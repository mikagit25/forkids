- id: showman
  title: The Vanishing Elephant
  narration: 'Houdini became one of the best paid performers in the world. He bought a big house in Harlem, filled it with books on magic, and wrote books himself. He crossed the Atlantic with the rich
    and famous. In 1914, on board the liner Imperator, he was photographed with a fellow passenger, the former president Theodore Roosevelt. On the twenty ninth of October 1914, he recorded his own voice
    on wax cylinders, practising the speech that introduced the water torture cell. They are the only recordings of his voice that we know. And in 1918, at the huge Hippodrome theatre in New York, he made
    a full grown elephant called Jennie disappear from the stage. That same year, he moved into films. He starred in a fifteen part serial, The Master Mystery, and then in feature films such as The Grim
    Game. He did his own stunts, swam rivers and was frozen into ice. But the films did not make money, and he gave up acting.

    '
