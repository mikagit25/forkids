- id: mother
  chapter: Chapter 5
  title: Do Spirits Return?
  narration: 'After the First World War, millions of families in Europe and America had lost someone. Many of them turned to spiritualism. In darkened rooms, mediums promised to bring back the voices of
    the dead, and they were paid for it. Houdini had trained all his life in the art of deception. When he sat in the séance rooms, what he saw were tricks, and he knew the tricks better than anyone. What
    made him angry was that they were played on people in grief. In the 1920s, he made it his mission to expose them. He went to séances in disguise, with a reporter and a police officer. On stage, he showed
    audiences how spirits rang bells, wrote on slates and made hands appear in the dark. Do spirits return, asked his posters. Houdini says no, and proves it. He even had himself photographed with the ghost
    of Abraham Lincoln, a simple double exposure, to show how easily spirit photographs could be made.

    '
