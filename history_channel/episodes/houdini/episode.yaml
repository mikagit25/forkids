- id: doyle
  title: Houdini and Conan Doyle
  narration: 'One of Houdini''s friends was Sir Arthur Conan Doyle, the creator of Sherlock Holmes, and one of the most famous believers in spiritualism in the world. Doyle believed in mediums, in spirit
    photographs, even in photographs of fairies taken by two girls in Cottingley, which were later proved to be a hoax. Houdini told him again and again that his own feats were tricks. Doyle did not believe
    him. He became convinced that Houdini himself had supernatural powers, and that he used them to block the real mediums. The two men fell out, and their friendship ended in public quarrels in the newspapers.

    '
