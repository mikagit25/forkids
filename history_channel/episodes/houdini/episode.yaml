- id: flight
  chapter: Chapter 4
  title: The Flying Magician
  narration: 'Houdini was always looking for the next impossible thing. In 1909, he fell in love with flying. He bought a French Voisin biplane for five thousand dollars and hired a full time mechanic.
    After crashing once, he made his first successful flight in Hamburg, on the twenty sixth of November 1909. The next year, he took the aeroplane with him on a tour of Australia. On the eighteenth of
    March 1910, at a paddock at Diggers Rest near Melbourne, he made three flights, one of them more than three kilometres long. Spectators signed a certificate to prove it. It was one of the first powered
    flights ever made in Australia. Three days later, he stayed in the air for more than seven minutes. Then he shipped the plane back and put it into storage in England. Soon the stage called him back.

    '
