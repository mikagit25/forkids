- id: legacy
  chapter: Epilogue
  narration: 'Houdini was buried in the Machpelah Cemetery in Queens, New York, under the crest of the Society of American Magicians, of which he had been president. Before he died, he and Bess had agreed
    on a secret code. If there was any way to speak from the other side, he would send her the words Rosabelle, believe. Rosabelle was the song she had been singing when they first met. For ten years, every
    Halloween, Bess held a séance. No message ever came. In 1936, after the last séance on the roof of a hotel in Hollywood, she blew out the candle she had kept burning beside his photograph. Houdini left
    much of his great collection of books on magic and spiritualism to the Library of Congress. Many of the pictures in this film come from there. A hundred years later, his name still means the impossible
    escape. If you enjoyed this story from the archives, subscribe for more.

    '
  candidates:
