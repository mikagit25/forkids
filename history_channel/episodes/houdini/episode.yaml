- id: immigrant
  chapter: Chapter 1
  title: The Rabbi's Son
  narration: 'He was born Erik Weisz, in Budapest, on the twenty fourth of March 1874, into a Jewish family. His father, Mayer Samuel Weisz, was a rabbi. To escape discrimination, the family left Hungary.
    They arrived in the United States on the third of July 1878 and changed their name to Weiss. Erik became Ehrich. His father became the rabbi of a small Reform congregation in Appleton, Wisconsin. But
    he lost the job in 1882, and the family moved to Milwaukee, where they fell into deep poverty. Little Ehrich took any work he could find. At the age of nine, he made his first public appearance as a
    trapeze artist. He called himself Ehrich, the Prince of the Air. In 1887, he and his father moved to New York, to a boarding house on East 79th Street, and the rest of the family followed.

    '
