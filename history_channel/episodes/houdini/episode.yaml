- id: beginnings
  title: Harry Houdini
  narration: 'As a teenager, Ehrich read the memoirs of the great French magician Jean-Eugène Robert-Houdin. He made his stage name from his hero''s: Houdini. Harry probably came from Ehri, his family''s
    nickname for him. He started as a professional magician in 1891, and for years he had little success. He worked in dime museums and sideshows. He did card tricks and called himself the King of Cards.
    At one circus, he even doubled as the Wild Man. With his brother Theodore, whom everyone called Dash, he performed as the Brothers Houdini, and in 1893 they worked at the Chicago World''s Fair. In 1894
    he met a young performer, Wilhelmina Beatrice Rahner, known as Bess. She married Harry, took Dash''s place in the act, and stayed at his side on stage for the rest of his career. Together, the Houdinis
    toured with circuses and travelling shows. One of their numbers, Metamorphosis, was a lightning exchange: the man locked in a trunk, and a moment later, the woman in his place.

    '
