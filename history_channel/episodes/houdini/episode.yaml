- id: stunts
  title: Upside Down Over the Street
  narration: 'His best advertising was free, and it happened in the street. In the East River in 1912, he escaped from the nailed packing crate in fifty seven seconds. Later, he repeated the stunt many
    times. Even more popular was the suspended straitjacket escape. Houdini was strapped into a regulation straitjacket and hung by his ankles from a tall building or a crane, high above the crowd. In New
    York, he did it from a crane building the subway. From the moment he was hoisted up to the moment the jacket fell, it took two minutes and thirty seven seconds. In January 1922, in Washington, thousands
    of people stopped in the street to watch him wriggle free, upside down, outside Keith''s Theatre. He escaped from riveted boilers, from wet sheets, from mail bags, and once, in Boston, from the belly
    of a whale that had washed ashore.

    '
