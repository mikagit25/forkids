- id: water
  chapter: Chapter 3
  title: Failure Means a Drowning Death
  narration: 'By 1908, every music hall had its own handcuff king, and Houdini needed something new. That year, he introduced the Milk Can Escape. He was handcuffed and locked inside an oversized milk can
    filled with water. The posters said: Failure means a drowning death. He invited the audience to hold their breath along with him. The same year, in Boston, a crowd watched him jump from the Harvard
    Bridge into the river below. Imitators copied the milk can almost at once. Houdini went to court to protect his act, and then he invented something nobody else could copy. On the twenty first of September
    1912, at the Circus Busch in Berlin, he first performed the Chinese Water Torture Cell in public. His feet were locked in stocks, he was hung upside down and lowered head first into a glass tank full
    of water, and a curtain was drawn. He performed it until the end of his life.

    '
