- id: cold-open
  montage: true
  narration: 'On the seventh of July 1912, a short, stocky man was locked in handcuffs and leg irons and nailed into a wooden packing crate. The crate was roped, weighed down with two hundred pounds of
    lead and lowered into the East River in New York. Fifty seven seconds later, he came up to the surface, free. He had escaped from handcuffs at Scotland Yard, from police cells all over Europe and America,
    from a milk can full of water and from a glass tank, hanging upside down. Millions of people believed he could get out of anything. He spent the last years of his life proving that there was no magic
    in it at all. This is the story of Harry Houdini.

    '
