- id: margery
  title: Margery
  narration: 'In 1924, the magazine Scientific American offered a cash prize to any medium who could prove supernatural powers under test conditions. Houdini sat on the committee. The strongest candidate
    was Mina Crandon, the wife of a Boston surgeon, known as Margery. In July 1924, Houdini attended two séances at her home. He said that in the dark, Margery had slipped out of control and stretched her
    foot to ring a bell. For the next tests, he asked her to wear an apparatus that stopped her from using her legs. The committee did not award the prize. Nobody ever won it. The same year, he exposed
    a young Spaniard who claimed to have x-ray eyes. He was simply peeking under his blindfold. Houdini wrote a book about it all, A Magician Among the Spirits.

    '
