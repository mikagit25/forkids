summary: >
  In 1918, a new influenza swept the world in three waves and killed tens of millions of people, more than the war it
  travelled with. We follow it from an army camp in Kansas to the parade that filled Philadelphia's hospitals, the nurses
  who fought it without medicine, the masks and the people who refused them, two Pacific islands that made opposite
  decisions, India's catastrophe, and a village in Alaska whose frozen graves let scientists bring the virus back to life.

