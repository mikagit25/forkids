scenes:
  - id: cold-open
    montage: true          # fast cuts + one teaser photo from every chapter
    narration: >
      In the autumn of 1918, a city threw a parade for two hundred thousand people. Within days, every hospital bed was full.
      Healthy young soldiers felt fine at breakfast and were dead by nightfall. Nurses ran out of beds, doctors ran out of answers, and cities ran out of coffins.
      On two islands in the Pacific, one governor closed the harbour and the other did not, and the difference was counted in thousands of lives.
      And in a frozen grave in Alaska, the virus waited for almost eighty years.
      Children even sang about it in the street. I had a little bird, its name was Enza. I opened the window, and in-flew-Enza.
      It infected around five hundred million people, one in three humans alive, and killed at least fifty million.
      This is the story of the 1918 influenza pandemic, told through the photographs and documents it left behind.
    quote:
      text: "I had a little bird,\nIts name was Enza.\nI opened the window,\nAnd in-flu-enza."
      source: "Children's skipping rhyme, United States, 1918"
      match: "I had a little bird"
      sentences: 2           # the rhyme is read as two sentences
    images:
      - {file: "curid:15677879"}
      - {file: "curid:109932599"}
      - {file: "curid:6213389"}
      - {file: "curid:88520623"}

  - id: kansas
    chapter: "I. A Cook in Kansas"
    date: "March 1918"
    narration: >
      The story is usually told starting at Camp Funston, a vast army training camp in Kansas.
      On a morning in early March 1918, a company cook reported to the infirmary with a fever, a sore throat and aching muscles.
      By lunchtime, dozens more soldiers had joined him. Within weeks, more than a thousand men were sick.
      Most of them recovered. This first wave looked like an ordinary, if unusually fast, spring flu, and newspapers barely noticed.
      Historians still argue about where the virus really began. Kansas, France, Britain and China have all been proposed, and the question may never be settled.
      What is certain is that the army camps of 1918 were perfect incubators: tens of thousands of young men from every corner of the country, packed into barracks, then shipped across the Atlantic.
      The war gave the virus a free ride to Europe, and then, a few months later, a free ride back.
    images:
      - {file: "curid:25513204", colorize: true}
      - {file: "curid:108658111"}
      - {file: "curid:95964964"}
      - {file: "curid:33536385"}
      - {file: "curid:80764806"}
      - {file: "curid:62438308"}
      - {file: "curid:31602643"}

  - id: name
    chapter: "II. The Wrong Name"
    narration: >
      The world would come to call it the Spanish flu. But it almost certainly did not start in Spain.
      Spain was neutral in the war, and its newspapers were not censored.
      While the warring nations kept news of sickness quiet to protect morale, Spanish papers reported the epidemic openly, including the illness of their own king, Alfonso the Thirteenth.
      So it looked, to the rest of the world, as if Spain was the worst hit.
      In Spain, meanwhile, many people called it the French flu.
      Censorship did more than give the disease the wrong name. It meant that when the real danger arrived, many people were told there was nothing to worry about.
    images:
      - {file: "curid:126709302"}
      - {file: "curid:37885700"}
      - {file: "curid:75049767"}
      - {file: "curid:96716013"}
      - {file: "curid:87034599"}
      - {file: "curid:54737081"}

  - id: second-wave
    chapter: "III. The Second Wave"
    date: "Autumn 1918"
    narration: >
      In late August 1918, the virus came back, and it had changed.
      Almost at the same time, a far more lethal form appeared in ports on three continents: Brest in France, Freetown in Sierra Leone, and Boston in the United States.
      Outside Boston, at Camp Devens, the army hospital filled within days. In September, the army sent one of the country's most respected doctors, Victor Vaughan, to see it for himself.
      He found every bed taken and young men dying in the corridors. On the day he arrived, sixty-three soldiers died.
      Healthy people could feel well at breakfast and be dead by nightfall. Doctors described patients whose faces turned a dusky blue as their lungs filled with fluid, a sign of oxygen starvation that nurses learned to dread.
      Vaughan later wrote a sentence that captures the fear of that autumn.
      If the epidemic continues its mathematical rate of acceleration, civilization could easily disappear from the face of the earth.
    quote:
      text: "If the epidemic continues its mathematical rate of acceleration, civilization could easily disappear from the face of the earth."
      source: "Dr. Victor C. Vaughan, US Army Medical Department, 1918"
      match: "If the epidemic continues"
    images:
      - {file: "curid:98404173"}
      - {file: "curid:95962027"}
