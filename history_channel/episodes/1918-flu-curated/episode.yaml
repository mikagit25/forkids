  - id: brevig
    chapter: "X. The Village in the Ice"
    date: "Brevig Mission, Alaska"
    narration: >
      In November 1918, the virus reached Brevig Mission, a tiny village on the coast of Alaska.
      In five days, seventy-two of its eighty adults died. They were buried together in a mass grave in the frozen ground.
      In 1951, a young Swedish scientist named Johan Hultin dug into that grave, hoping to recover the virus. He failed.
      Forty-six years later, at the age of seventy-two, he went back.
      This time he found the body of a woman, preserved by the permafrost, whose lungs still carried fragments of the virus's genetic code.
    cards:                 # big-number cards, shown while the matching sentence is read
