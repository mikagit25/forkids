  - id: resurrection
    chapter: "XI. Bringing It Back"
    date: "2005"
    narration: >
      Working with Jeffery Taubenberger's team, who had pieced together the virus's genes from preserved tissue samples, scientists finally had the complete genetic recipe of the 1918 virus.
      In 2005, at a high-security laboratory at the US Centers for Disease Control, the microbiologist Terrence Tumpey reconstructed it.
      The precautions were extraordinary. Only Tumpey was allowed to handle the virus. He worked alone, after hours, passing fingerprint and iris scans to enter the lab, and took an antiviral drug every day in case of infection.
      What he found explained a great deal. Some infected mice died within three days. Four days after infection, their lungs held thirty-nine thousand times more virus than mice infected with a comparison strain.
      When he swapped out individual genes, the virus became far less deadly. It was the combination of all eight genes together that made the 1918 virus so exceptionally virulent.
      For the first time since 1918, the virus existed again, so that researchers could finally ask what made it so lethal, and how to recognise the next one before it spreads.
    images:
      - {file: "curid:1314479"}
      - {file: "curid:593472"}
      - {file: "curid:82983798"}

  - id: closing
    chapter: "Epilogue"
    narration: >
      The 1918 pandemic killed more people than the war it travelled with. Yet for decades it was almost forgotten, overshadowed by the armistice and the peace.
      Its lessons were written in the records of crowded hospitals, emergency ordinances and mass graves. In Philadelphia and St. Louis. In Western and American Samoa.
      And they came back into focus every time a new virus began to spread.
      The children who sang about a little bird named Enza grew up, and many of them never forgot why.
      If you enjoyed this story from the archives, subscribe for more forgotten chapters of medical history.
    images:
      - {file: "curid:1240267"}
      - {file: "curid:27680046"}
