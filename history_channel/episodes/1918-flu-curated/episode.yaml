      - {file: "curid:73895117"}
      - {file: "curid:16604995"}

  - id: philadelphia
    chapter: "IV. The Parade"
    date: "28 September 1918"
    narration: >
      Nowhere shows the cost of a bad decision more clearly than Philadelphia.
      By late September, sailors at the city's navy yard were already falling ill. Many local doctors urged the authorities to cancel public events.
      But on the twenty-eighth of September, the city went ahead with a huge parade to sell war bonds.
      Officials had expected around ten thousand spectators. More than two hundred thousand people packed the streets, shoulder to shoulder, cheering the marching bands.
      Within days, every one of the city's thirty-one hospitals was full.
      In the weeks that followed, Philadelphia ran out of coffins and gravediggers. Bodies waited in homes for days. Priests drove horse carts through the streets, collecting the dead.
      More than twelve thousand Philadelphians died.
    cards:                 # big-number cards, shown while the matching sentence is read
      - {big: "200,000", text: "people packed the parade route", match: "More than two hundred thousand people"}
    images:
