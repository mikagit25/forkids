  de:
    title: "1918: Die Pandemie, die sich hinter einem Krieg versteckte"
    subtitle: "Wie sich die tödlichste Grippe der Geschichte ausbreitete, wer sie ohne Medikamente bekämpfte und wie die Wissenschaft sie wieder zum Leben erweckte"
    summary: >
      1918 fegte eine neue Grippe in drei Wellen um die Welt und tötete Dutzende Millionen Menschen – mehr als der Krieg, mit
      dem sie reiste. Wir folgen ihr von einem Armeelager in Kansas zur Parade, die Philadelphias Krankenhäuser füllte, zu
      den Krankenschwestern, die sie ohne Medikamente bekämpften, zu den Masken und denen, die sie verweigerten, zu zwei
      Pazifikinseln mit gegensätzlichen Entscheidungen, zur Katastrophe in Indien und zu einem Dorf in Alaska, dessen
      gefrorene Gräber es Forschern ermöglichten, das Virus wieder zum Leben zu erwecken.
    chapters: ["Einleitung", "Ein Koch in Kansas", "Der falsche Name", "Die zweite Welle", "Die Parade",
