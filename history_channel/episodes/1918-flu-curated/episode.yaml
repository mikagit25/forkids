  - id: who-it-killed
    chapter: "VI. The Wrong Victims"
    narration: >
      Ordinary flu kills mostly the very young and the very old.
      The 1918 virus did that too, but it also struck down healthy adults between twenty and forty, people in the prime of their lives.
      Researchers still debate why. One theory is that strong young immune systems over-reacted, flooding the lungs with inflammation.
      Another is that older people had been exposed to a similar virus decades earlier, and kept some protection.
      Whatever the reason, the effect was staggering. Families lost both parents in a single week. Orphanages filled.
      In the United States, life expectancy fell by more than ten years in a single year, and October 1918 became the deadliest month in American history.
