  - id: samoa
    chapter: "VIII. Two Islands"
    date: "November 1918"
    narration: >
      Perhaps the starkest lesson of all came from two neighbouring groups of islands in the South Pacific.
      On the seventh of November 1918, a steamer called the Talune arrived at Apia, in Western Samoa, then governed by New Zealand. Sick passengers were allowed ashore.
      Within weeks, around eight and a half thousand people had died, more than a fifth of the population.
      Just across the water, American Samoa was run by a naval governor, John Poyer. Without waiting for orders, he closed the islands. Samoan volunteers patrolled the shore to stop illegal landings, and new arrivals were kept under watch.
      American Samoa recorded no deaths from influenza at all.
      Same virus, same ocean, two different decisions.
