  - id: masks
    chapter: "VII. Masks and Rebels"
    date: "San Francisco, 1918–1919"
    narration: >
      Doctors in 1918 had no vaccine against influenza, and no antibiotics to treat the bacterial pneumonia that killed so many patients.
      They did not even know that the disease was caused by a virus. That would not be discovered until the 1930s.
      So cities fought back with the only tools they had: closing schools, churches and theatres, banning public gatherings, and ordering people to wear gauze masks.
      San Francisco went furthest. From the twenty-fifth of October 1918, everyone in public had to wear a mask. People who refused could be fined or jailed. Even the mayor and the city's health officer were fined, after being caught without masks at a boxing match.
      The order was lifted in November. When cases rose again, it returned in January 1919, and this time many residents had had enough.
      An Anti-Mask League was formed, and around four and a half thousand people came to its first public meeting. A week later, the order was lifted for good.
      Studies of the pandemic later showed that cities which acted early and kept their measures in place, like St. Louis, saw far lower peaks of death than cities that hesitated.
