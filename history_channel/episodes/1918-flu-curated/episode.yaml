  - id: cold-open
    montage: true          # fast cuts + one teaser photo from every chapter
    speed: 1.0             # RULES.md: the hook is read a little faster than the body (0.93); keep it under 30 s
    narration: >
      In the autumn of 1918, a city threw a parade for two hundred thousand people. Within days, every hospital bed was full.
      Healthy young soldiers felt fine at breakfast and were dead by nightfall.
      Two islands in the Pacific made two different decisions, and the difference was counted in thousands of lives.
      In the end, one in three people alive caught it, and at least fifty million died.
