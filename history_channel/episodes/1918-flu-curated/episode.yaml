  - id: nurses
    chapter: "V. The Nurses"
    narration: >
      If doctors could do little, nurses could do a great deal: keeping patients warm, fed and hydrated could be the difference between life and death.
      But there were not enough of them. More than half of the army's twenty thousand nurses had already sailed to Europe when the second wave hit America.
      The American Red Cross launched a national appeal. It placed newspaper advertisements, asked hospitals to release staff, and accepted nurses still in training.
      At the height of the crisis, anyone who had completed a single Red Cross nursing course could be sent to the wards.
      Thousands of nurses fell ill. Hundreds died. The army decided that nurses who died of influenza, even those who never left the country, had died in the line of duty.
      The crisis also cracked an old barrier. The Army Nurse Corps had refused to employ Black nurses. In the final months of 1918, a handful were finally admitted, among them Aileen Cole, who had spent the epidemic nursing miners in West Virginia.
