  - id: world
    chapter: "IX. Around the World"
    narration: >
      No country suffered more than India. The virus is thought to have arrived in Bombay in the summer of 1918, perhaps on a troop ship returning from Europe.
      It then followed the railways inland, through towns and villages already weakened by a failed monsoon and food shortages.
      Historians estimate that at least twelve million Indians died, and possibly far more. That may be a quarter or more of all the deaths in the world.
      In Brazil, the virus did not spare the powerful. Rodrigues Alves, elected president in 1918, fell ill and died in January 1919, before he could take office.
      From the Arctic to South Africa, from Brazil to China, the pattern repeated. Almost no inhabited place on Earth escaped.
