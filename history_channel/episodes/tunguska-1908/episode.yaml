  - id: chelyabinsk
    chapter: "IX. It Happened Again"
    date: "2013"
    narration: >
      For a long time, Tunguska seemed like a once-in-a-millennium event.
      Then, on the fifteenth of February 2013, a much smaller asteroid, about eighteen metres across, exploded over the Russian city of Chelyabinsk.
      This time thousands of cameras were watching. The blast released around half a megaton of energy. It shattered windows across the city and injured more than a thousand people, almost all of them from flying glass.
      The Chelyabinsk object was a fraction of the size of the Tunguska one. Had the 1908 explosion happened over a city instead of the empty taiga, the result would have been a catastrophe.
    images:
      - {query: "Chelyabinsk meteor", modern: true, count: 1}
      - {query: "Bennu", modern: true, count: 2}

  - id: closing
    chapter: "Epilogue"
    narration: >
      Today, the thirtieth of June is marked around the world as Asteroid Day, chosen in memory of Tunguska.
      Space agencies now track thousands of near-Earth objects. In 2022, NASA's DART mission deliberately crashed a spacecraft into a small asteroid and changed its orbit, the first test of how we might one day defend ourselves.
      The forest at Tunguska has grown back. But if you walk there today, you can still find the old fallen trunks, all pointing away from the place where the sky exploded.
      If you enjoyed this story from the archives, subscribe for more.
    images:
      - {query: "DART Dimorphos", modern: true, count: 1}
      - {query: "taiga Siberia", modern: true, count: 1}

