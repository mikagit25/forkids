  - id: morning
    chapter: "I. Thirtieth of June"
    date: "1908"
    narration: >
      The date was the thirtieth of June 1908, by the modern calendar. In the Russian Empire, which still used the old Julian calendar, it was the seventeenth.
      Shortly after seven in the morning local time, people scattered across the vast forests of central Siberia saw a column of blue-white light move across the sky, almost as bright as the sun.
      Then came a flash, and a sound like artillery fire, rolling on and on.
      The explosion happened above one of the emptiest places on Earth, near the Podkamennaya Tunguska river, a tributary of the Yenisei. The nearest settlements were small trading posts and the camps of Evenk reindeer herders. The Evenks lived in small family groups, in conical tents called chums, herding reindeer, hunting and fishing, and paying their taxes to the Tsar in furs. Witnesses later described an object brighter than the sun crossing the sky from the south-east, leaving a thin white trail. It was seen from hundreds of kilometres away. After the flash, a column of fire and a cloud of smoke rose tens of kilometres into the sky.
    candidates: ["Evenki reindeer herders", "Siberia taiga 1900s", "Yenisei river 1900s", "Evenk chum tent"]
    images:
