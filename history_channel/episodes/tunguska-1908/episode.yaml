  - id: world
    chapter: "III. Bright Nights"
    narration: >
      The rest of the world did not know where the explosion had happened. But it noticed.
      Seismic stations as far away as Irkutsk, Tashkent, Tiflis and Jena recorded the shock as if it were a moderate earthquake. Barographs across the world, including in London, registered the pressure wave as it travelled around the planet. It was recorded in Berlin and Potsdam, in Zagreb, and as far away as Batavia, in the Dutch East Indies, and Washington.
      And for several nights, from the thirtieth of June to early July, the skies over Europe and western Asia stayed strangely bright. People wrote to newspapers about glowing clouds and midnight twilight. The Times in London printed letter after letter. The bright nights were seen from Bordeaux to Tashkent, and from Aberdeen to Stockholm. In England, the astronomer William Denning had to give up his observations, because the sky was simply too bright. In some places it was possible to read a newspaper outdoors at midnight. Nobody connected these reports to a remote corner of Siberia. Only in 1925 did a scientific paper link the old earthquake records to Tunguska, and the world's barograph traces were matched to it only in the 1930s.
    candidates: ["noctilucent clouds", "barograph", "seismograph 1900s", "The Times 1908 sky glow", "midnight twilight London 1908"]
