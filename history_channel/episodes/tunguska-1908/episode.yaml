  - id: closing
    chapter: "Epilogue"
    narration: >
      Today, the thirtieth of June is marked around the world as Asteroid Day, chosen in memory of Tunguska. It was founded in 2014 by a group that included the physicist Stephen Hawking and the astrophysicist and Queen guitarist Brian May, and in 2016 the United Nations proclaimed it an international day.
      Space agencies now track thousands of near-Earth objects. On the twenty-sixth of September 2022, NASA's DART mission deliberately crashed a spacecraft into a small asteroid moon called Dimorphos. The impact shortened its orbit by thirty-two minutes, the first real test of how we might one day defend ourselves. The site of the explosion is now protected as a nature reserve.
      The forest at Tunguska has grown back. But if you walk there today, you can still find the old fallen trunks, all pointing away from the place where the sky exploded.
      If you enjoyed this story from the archives, subscribe for more.
