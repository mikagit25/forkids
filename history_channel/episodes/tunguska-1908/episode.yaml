  - id: expeditions
    chapter: "VI. The Search Goes On"
    narration: >
      Kulik returned again and again. In 1928 and 1929, with larger teams, he mapped the fallen forest and photographed the damage. Those photographs are the ones that made Tunguska famous around the world. In 1938 he arranged an aerial survey, and fifteen hundred photographs of the flattened forest were taken from the air. Decades later, in 1975, the original negatives were burned on official orders, because the old nitrate film was a fire hazard. Fortunately, prints had been kept in the city of Tomsk.
      After Kulik's death, other scientists took up the work. In the 1950s and 1960s, Soviet expeditions sifted the soil of the area and found tiny spheres of melted rock and metal, microscopic droplets that could have come from a vaporised space object. Chemical analysis showed that they were rich in nickel compared with iron, just like meteorites. Later expeditions found the same tiny spheres trapped in the resin of trees that had lived through the blast.
      Researchers also mapped the direction of tens of thousands of fallen trees. The flattened area covered about two thousand one hundred and fifty square kilometres. Its shape looked like the wings of a butterfly, seventy kilometres from wingtip to wingtip. In the 1960s, Soviet scientists built model forests out of matches stuck in boards, and set off small charges above them on sloping wires. The matches fell in the same butterfly pattern. From its shape they could work out that the object had come in at a shallow angle, about thirty degrees above the horizon.
      In 2007, an Italian team proposed that a small lake near the area, Lake Cheko, might be a crater made by a surviving fragment. Other scientists disagree. In 2017, a Russian study of the lake's sediments concluded that the lake is at least two hundred and eighty years old, much older than the explosion. The debate continues.
    candidates: ["Tunguska expedition", "aerial photograph forest 1938", "Lake Cheko", "meteorite microscope spherules"]
