  - id: site
    chapter: "V. The Forest of Poles"
    date: "1927"
    narration: >
      What Kulik found was astonishing.
      For kilometres in every direction, the trees lay flat, their trunks pointing away from the centre, like spokes of a giant wheel.
      But when he reached the centre itself, he found something stranger still. The trees there were still standing upright, scorched and stripped of their branches, like a forest of telegraph poles.
      And there was no crater. No hole in the ground, no giant meteorite. Nothing.
      Kulik spent years searching. He found dozens of small round bogs, and was sure that some of them were meteorite craters. His team spent weeks draining one of them, known as Suslov's crater. At the bottom they found an old tree stump. It had been a bog for a very long time, and it was no crater. He never found the meteorite he was looking for.
    candidates: ["Tunguska fallen forest", "Kulik Tunguska 1929", "burnt forest standing trees", "Siberian bog swamp"]
