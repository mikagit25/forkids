  - id: chelyabinsk
    chapter: "IX. It Happened Again"
    date: "2013"
    narration: >
      For a long time, Tunguska seemed like a once-in-a-millennium event.
      Then, on the fifteenth of February 2013, a much smaller asteroid, about eighteen metres across, exploded over the Russian city of Chelyabinsk.
      This time thousands of cameras were watching. The blast released around half a megaton of energy. The flash was brighter than the sun. Minutes later, the shock wave arrived. It shattered windows across the city, and one thousand four hundred and ninety-one people sought medical help, almost all of them hurt by flying glass. Scientists used the data from Chelyabinsk to model Tunguska again, and concluded that the 1908 object had probably been a stony body fifty to eighty metres across.
      The Chelyabinsk object was a fraction of the size of the Tunguska one. Had the 1908 explosion happened over a city instead of the empty taiga, the result would have been a catastrophe.
    candidates: ["Chelyabinsk meteor", "Chelyabinsk meteorite fragment", "Chebarkul lake meteorite"]
