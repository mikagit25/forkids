  - id: theories
    chapter: "VII. A Hundred Theories"
    narration: >
      A mystery with no crater attracted every kind of explanation.
      Over the decades, people proposed a comet, a chunk of antimatter, a tiny black hole, a natural gas explosion from beneath the ground, and, inevitably, a crashed alien spaceship.
      Most of these ideas fall apart under the evidence. The serious debate was between two candidates. In 1934, the British meteorologist Francis Whipple suggested a small comet, a ball of ice and dust that would vaporise completely in the air and leave nothing behind. That might also explain the glowing nights, with dust and ice spread through the upper atmosphere. The date fitted too: the Tunguska explosion came at the peak of the Beta Taurids, a meteor shower linked to Comet Encke. For decades, Soviet researchers favoured the comet. Others argued for a stony asteroid. In the 1990s, Italian scientists extracted resin from the trees that had survived the blast, and found particles of material common in rocky asteroids and rare in comets. A study in 2001 calculated that the object had most probably come from the asteroid belt. More than seven hundred eyewitness accounts and around a thousand scientific papers later, the question is still not completely closed. Meanwhile, the wilder theories kept Tunguska famous, long after Kulik's expeditions ended.
      Kulik himself never got a final answer. When Germany invaded the Soviet Union, Kulik, nearly sixty years old, joined the people's militia. He was captured, and in 1942 he died of typhus in a German prisoner-of-war camp. A crater on the Moon and an asteroid are named after him.
    candidates: ["comet 1910 photograph", "Halley's comet 1910", "Comet Encke", "asteroid"]
    images:
