  - id: vanavara
    chapter: "II. The Trading Post"
    narration: >
      About sixty kilometres to the south, at the Vanavara trading post, a man named Semyon Semyonov was sitting on his porch.
      Years later, he described what he felt to investigators. He had just raised his axe to hoop a barrel when, as he put it, the sky was split in two, and high above the forest the whole northern part of the sky appeared to be covered with fire. At that moment I felt great heat, as if my shirt had caught fire. I wanted to pull off my shirt and throw it away, but at that moment there was a bang in the sky, and a mighty crash was heard. The blast threw him about six metres from the porch, and he briefly lost consciousness. His wife ran out and carried him into the hut. The crash was followed by a noise like stones falling from the sky, or guns firing. Windows shattered. The ground shook.
      Further north, much closer to the blast, an Evenk herder named Chuchan was asleep in his tent with his brother. Something pushed them awake. The tent was knocked down on top of them. When they crawled out, the trees were falling, their needles burning, the reindeer moss burning, and above the hills, he said, it was as if a second sun had appeared. At least three Evenks died. One of them, Ivan Machakugyr, was thrown against a tree and broke his arm, and died of the infection. Another, Lurbuman, died of shock. The third was a shaman named Uiban. Many Evenks believed the blast was the anger of Ogdy, their god of fire and thunder, and for years they avoided the place. Some Orthodox Christians in the region thought the end of the world had come, and put on their burial clothes. Whole herds of reindeer were lost, and storehouses were burned.
    quote:
      text: "As if my shirt had caught fire."
      source: "Semyon Semyonov, Vanavara trading post, recalling 30 June 1908"
      match: "As if my shirt had caught fire"
