- id: cold-open
  montage: true
  narration: 'The missing novelist is found, alive, in a hotel in Yorkshire, under another woman''s name. In Oslo, the Nobel Prizes go to a French physicist who proved that atoms are real, and to a Danish doctor whose discovery turned out to be wrong.
    In Montana, a fossil tooth threatens to rewrite the history of mankind. And in Florida, the last independent band of the Seminoles writes to the President to end a war that has lasted a hundred years. This is what the newspapers were telling their
    readers in the middle of December, one hundred years ago.

    '
