- id: jazz
  chapter: X. Two Young Men from the Band
  narration: 'On the ninth of December 1926, in Chicago, the band of the drummer Ben Pollack made a record for the Victor company. They played two dance tunes, When I First Met Mary and Deed I Do. Nobody paid much attention to the sidemen. But two of them
    were making their first records. One was a seventeen year old clarinettist from Chicago called Benny Goodman. The other was a trombonist and arranger called Glenn Miller. Ten years later, Goodman would be the King of Swing. Miller''s band would become
    the most popular in America. In December 1926, a radio set with six tubes was advertised in Maine for seventy five dollars. That was how most Americans heard dance bands like Pollack''s: through a loudspeaker in the living room.

    '
