- id: christie
  chapter: I. Found
  narration: 'When we left Agatha Christie, she had been missing for ten days. Her car had been found abandoned above a chalk pit at Newlands Corner in Surrey. People feared she had drowned herself in a nearby pond called the Silent Pool. The search was
    enormous. More than a thousand police officers and some fifteen thousand volunteers combed the countryside, and for the first time in a civilian search in Britain, aeroplanes were used. The Home Secretary himself pressed the police, and a newspaper
    offered a reward of one hundred pounds. In America, a small paper in Maine reported on the thirteenth of December: British sleuths baffled in search for missing novelist. It even called her an American novelist. She was not. The next day, the fourteenth
    of December, she was found. She was staying at the Swan Hydropathic Hotel in Harrogate, a spa town in Yorkshire, nearly three hundred kilometres from her home. She had signed the register as Mrs Tressa Neele, from Cape Town. Neele was the surname of
    the woman her husband had fallen in love with. What had happened? Two doctors declared that she had genuinely lost her memory. Some of her biographers believe she was in a state of shock called a fugue. Opinion is still divided. In her autobiography,
    Christie did not mention it at all. She went on to write sixty six detective novels.

    '
