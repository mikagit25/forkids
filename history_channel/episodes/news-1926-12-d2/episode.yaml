- id: coal
  chapter: VI. Gasoline from Coal
  narration: In its science pages, the same issue reported on a German chemist, Friedrich Bergius, who had found a way to turn coal into gasoline. Powdered coal was heated with hydrogen to about eight hundred degrees Fahrenheit, under enormous pressure.
    A ton of ordinary soft coal, the magazine said, would yield about forty five gallons of gasoline, along with heavier oils for diesel engines and lubricating oil. Asked whether his process would pay in America, Bergius politely declined to say. Five
    years later, in 1931, he shared the Nobel Prize in Chemistry for this work.
