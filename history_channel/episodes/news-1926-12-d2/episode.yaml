- id: ads
  chapter: XIII. Prices and Promises
  narration: 'And what were people buying, two weeks before Christmas 1926? A bank in Augusta, Maine, put Santa Claus on the front page of the local paper: the 1927 Christmas Club is now open, and it pays four per cent interest. You saved from twenty five
    cents to five dollars a week, and next December you had your Christmas money. The local paper''s comic strip followed a family on its Christmas shopping, with the Model T parked in front of the shop window. In the Literary Digest, a new Chrysler sixty
    coach cost one thousand one hundred and forty five dollars. Oldsmobile promised a car that would gratify the family''s finer tastes. Kimball sold pianos, Day-Fan and Balkite sold radios, and the florists said: say it with flowers this Christmas.

    '
