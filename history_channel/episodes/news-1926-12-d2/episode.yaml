- id: monalisa
  chapter: XII. This Week in 1913
  narration: 'And on the thirteenth of December 1913, newspapers all over the world carried the same astonishing headline. The Mona Lisa is found. The painting had been stolen from the Louvre in Paris on the twenty first of August 1911. For more than two
    years, nobody knew where it was. The thief was Vincenzo Peruggia, an Italian who had worked at the Louvre and had helped to build the painting''s glass case. He walked out with it, kept it hidden in a trunk in his room in Paris for two years, and then
    took it to Florence by train. There he offered it to an art dealer, Alfredo Geri. Geri called in the director of the Uffizi Gallery, who checked the painting and confirmed that it was genuine. The police arrested Peruggia at his hotel on the twelfth
    of December. He said he had wanted to bring the painting back to Italy. In Italy, many people saw him as a patriot. He served only seven months in prison. And the Mona Lisa, which before the theft had been admired mainly by art lovers, came back to
    Paris as the most famous painting in the world.

    '
