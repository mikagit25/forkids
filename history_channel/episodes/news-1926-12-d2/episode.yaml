- id: colour
  chapter: IX. The Colour Cure
  narration: 'The same issue of the Digest described a new treatment that was being tried in mental hospitals: colour. At the Peoria State Hospital in Illinois, patients sat in sun parlours with blue, violet, ruby or amber windows. Blue was said to calm
    the nerves. Red was said to stimulate. Yellow was said to bring cheer. One doctor even built a black room, with black floor, black beds, black walls and black curtains, and reported that a violent patient slept in it and improved. The colour cure was
    soon forgotten. But the Digest''s photograph of women doing needlework in a blue sun parlour shows how hopeful, and how helpless, medicine for the mind still was in 1926.

    '
