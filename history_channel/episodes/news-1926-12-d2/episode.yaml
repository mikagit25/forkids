- id: whitestar
  chapter: II. The Titanic's Company Is Sold
  narration: Another story from the sea caught the editors' eye that week. The Literary Digest of the eleventh of December reported that the White Star Line, the company of the Olympic, the Majestic and, fourteen years earlier, the Titanic, had been sold.
    Since the beginning of the century, White Star had belonged to the International Mercantile Marine, the American shipping trust put together by the banker J. P. Morgan. Now the trust sold it to a British company, the Royal Mail Steam Packet Company,
    for thirty five million dollars. The new owner was Lord Kylsant, whom the papers called the Napoleon of the seas. With White Star's forty ships, he would control more than five hundred vessels, and, the Digest said, he could sail right round the world,
    change to a dozen different lines, and still be on a ship in which he had a financial interest. Ownership was to pass on the first of January 1927. For the editors, it was the end of the elder Morgan's dream of a great American shipping trust.
