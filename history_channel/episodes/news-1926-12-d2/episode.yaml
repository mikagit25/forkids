- id: seminole
  chapter: VII. A Hundred Years' War
  narration: 'From Florida came an unusual letter. Under the headline Our oldest enemy sues for peace, the Literary Digest reported that a Seminole chief, Tony Tommy, had written to the President. He wanted to end the long war between the United States
    government and the last independent band of the Seminoles, about three hundred people living in the Everglades. Their ancestors had fought long wars against the United States in the nineteenth century. In 1837, their famous leader Osceola was seized
    while he came to talk under a flag of truce, and died in prison a year later. Most of the Seminoles were sent west to Oklahoma. A small band stayed in the swamps of Florida and never signed a peace. Now, in December 1926, their chief wrote that they
    wished to bring about a more amicable relationship with the United States government. The magazine printed a photograph of Tony Tommy with a film actress, and many editors joked about it. But some of them remembered the old poem in school readers,
    with Osceola''s words: I will not bend the knee.

    '
