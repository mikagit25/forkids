- id: piltdown
  chapter: V. This Week in 1912
  narration: 'On the eighteenth of December 1912, at a meeting of the Geological Society in London, an amateur archaeologist named Charles Dawson presented pieces of a skull and a jaw found in a gravel pit at Piltdown, in Sussex. Together with Arthur Smith
    Woodward of the Natural History Museum, he announced a new kind of early human: the dawn man of Piltdown. Two days later, The Sun in New York reported: Oldest skull stirs New York scientists. Man lived before ice. Some experts had doubts from the start.
    But Piltdown Man was accepted for decades. It was not until 1953 that scientists at the British Museum proved it was a forgery: the skull of a modern human combined with the jaw of an orangutan, its teeth filed down and the bones stained to look old.
    A review in 2016 concluded that the forger was almost certainly Dawson himself.

    '
