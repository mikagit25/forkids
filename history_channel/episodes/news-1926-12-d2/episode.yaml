- id: inventions
  chapter: XI. This Week in 1901 and 1903
  narration: 'Two of the greatest inventions of the twentieth century were announced in this same week of December. On the twelfth of December 1901, on Signal Hill above St. John''s in Newfoundland, Guglielmo Marconi was listening for a signal. His aerial
    was a wire hanging from a kite, a hundred and fifty metres up. From his station at Poldhu in Cornwall, three thousand five hundred kilometres away, came three faint clicks: the letter S in Morse code. It was the first radio signal across the Atlantic.
    Four days later, a New York paper drew him as the wizard of the twentieth century. Two years later, on the seventeenth of December 1903, at Kill Devil Hills near Kitty Hawk in North Carolina, Orville and Wilbur Wright flew. The first flight, by Orville,
    lasted twelve seconds and covered thirty seven metres. The best flight of the day lasted fifty nine seconds. The brothers telegraphed their father to inform the press. But a telegraph operator leaked the message, and a newspaper in Virginia invented
    most of the story. Two days later, the Savannah Morning News told its readers that the machine had flown three miles.

    '
