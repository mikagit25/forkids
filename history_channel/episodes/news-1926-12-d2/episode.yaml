- id: nobel
  chapter: III. The Prizes of 1926
  narration: 'On the tenth of December, the Nobel Prizes for 1926 were awarded. The Peace Prize went to two men who had been enemies only eight years earlier: Aristide Briand of France and Gustav Stresemann of Germany, for the Locarno treaties, which were
    meant to reconcile their two countries after the war. Britain''s Austen Chamberlain had received a share of the prize a year earlier for the same agreement. The prize for literature went to Grazia Deledda, a writer from the island of Sardinia. She
    was the first Italian woman to receive it, and only the second woman ever, after the Swede Selma Lagerlöf. In physics, the prize went to Jean Perrin of France. By measuring how tiny particles jiggle in a liquid, he had confirmed Albert Einstein''s
    theory and proved that atoms and molecules really exist. In chemistry, it went to the Swede Theodor Svedberg, for his work with a machine that spins samples so fast that it can separate proteins, the ultracentrifuge. And the prize in medicine went
    to the Danish doctor Johannes Fibiger, for showing that a tiny worm could cause cancer in rats. He was wrong. Later research showed that the tumours in his rats had other causes, among them a lack of vitamin A. It is often cited today as one of the
    great mistakes in the history of the Nobel Prize.

    '
