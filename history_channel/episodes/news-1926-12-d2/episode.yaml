- id: fossil
  chapter: IV. The Most Important Fossil Ever Found?
  narration: 'Science made headlines in another way that week. The Literary Digest of the eighteenth of December 1926 asked: the most important fossil ever found? Early in November, a doctor called J. C. F. Siegfriedt, from Bearcreek in Montana, had found
    a fossil tooth in a coal mine near his town. It looked very much like a human molar. The rock around it was tens of millions of years old. If the tooth was human, the magazine said, it was by far the oldest relic of man ever found, and many chapters
    of geology would have to be rewritten. Or, it added carefully, it might belong to an ancient animal, and be a remarkable coincidence. Today, scientists know that the human family is only a few million years old. No human tooth could have lain in rocks
    so ancient. Readers in 1926 had good reason to be careful. Fourteen years earlier, in the same week of December, the whole world had been shown a missing link.

    '
