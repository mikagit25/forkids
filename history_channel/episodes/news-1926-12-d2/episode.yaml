summary: 'What were the newspapers saying between the 8th and the 20th of December 1926? Agatha Christie is found in Harrogate, the 1926 Nobel Prizes (and one famous mistake), a Montana tooth hailed as "the most important fossil ever found", the Piltdown
  Man of 1912, a Seminole chief''s letter to the President, the colour cure, Benny Goodman''s first record, Marconi''s signal and the Wright brothers'' first flight, and the day the Mona Lisa was found in 1913 - with the original newspaper pages.

  '
