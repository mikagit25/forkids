- id: whitehouse
  chapter: VIII. Below Stairs at the White House
  narration: 'For lighter reading, the Digest of the eleventh of December quoted the memoirs of Elizabeth Jaffray, who had kept house in the White House for seventeen years, for four presidents: Taft, Wilson, Harding and Coolidge. Her favourite story was
    about William Howard Taft. He liked every sort of food, she wrote, except eggs. His great weakness was a breakfast steak of twelve ounces, with two oranges, toast and butter and a vast quantity of coffee with cream and sugar. He also paid a physical
    trainer a thousand dollars a year to exercise him every morning. And to think of Will being so silly, said Mrs Taft, as to pay that trainer for punching him about. On the twenty seventh of November 1911, Mrs Jaffray wrote in her diary that the President
    weighed three hundred and thirty two pounds, and had told her, with a great laugh, that he was going on a diet.'
