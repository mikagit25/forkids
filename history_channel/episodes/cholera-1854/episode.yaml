  - id: sewers
    chapter: "X. Bazalgette's Sewers"
    narration: >
      Parliament acts quickly when it can smell the problem. In August 1858, it passed a law giving the city the money and power to fix it. The Metropolitan Board of Works could borrow three million pounds, to be repaid by a small charge on every London household for the next forty years.
      The job went to the engineer Joseph Bazalgette. His plan was enormous: about eighty-two miles of huge brick sewers, fed by around eleven hundred miles of street sewers, carrying waste east, away from the city, before releasing it downstream.
      Work began in 1859. Along the river, new embankments were built to carry the sewers, and roads and gardens were laid on top. The work used three hundred and eighteen million bricks. In April 1865, the Prince of Wales started the great steam engines of the Crossness Pumping Station, on the marshes east of London, and in 1870 he opened the Victoria Embankment. The system was fully working by 1875, the year Bazalgette was knighted, and much of it is still in use today.
      Bazalgette built it to deal with the smell. But in doing so, he also cut off cholera's main route into the city's water. The new sewers still emptied into the Thames, further downstream, without treatment. In 1878, a pleasure steamer, the Princess Alice, sank close to the outfalls, and more than six hundred and fifty people died. Newspapers asked whether the sewage had killed some of them. Over the following years, London began to treat its sewage, and ships carried the sludge out to sea, a practice that continued until 1998.
