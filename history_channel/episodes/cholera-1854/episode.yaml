  - id: outbreak
    chapter: "III. Broad Street"
    date: "31 August 1854"
    narration: >
      The outbreak in Soho began on the thirty-first of August 1854. In the first three days, a hundred and twenty-seven people on or near Broad Street died. Within a week, three quarters of the residents had fled. By the tenth of September, more than three hundred were dead. Snow later called it the most terrible outbreak of cholera which ever occurred in this kingdom. Many of the sick were carried to the Middlesex Hospital. A nurse who would soon become famous, Florence Nightingale, came to help. According to the novelist Elizabeth Gaskell, she was up night and day, receiving the patients herself.
      Snow lived nearby. He suspected the water at once, and his suspicion fell on a public pump on Broad Street, a popular well in the heart of the outbreak.
      He took samples of the water. It looked fairly clean. Under the microscope he saw some white particles, but nothing conclusive.
      So he did something else. He went from door to door.
