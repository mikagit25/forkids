  - id: blue-death
    chapter: "I. The Blue Death"
    narration: >
      Cholera came from India. In 1817 it began to spread out of Bengal along trade routes and with armies, and over the following years it swept across Asia, Russia and Europe. It arrived in Britain for the first time in October 1831, in the port of Sunderland, carried by a ship from the Baltic. It came back again and again, killing tens of thousands. In London alone, the epidemics of 1832 and 1849 killed more than fourteen thousand people.
      It was a horrifying disease. Doctors described the diarrhoea as rice water: an untreated patient could lose ten to twenty litres of fluid in a day. Victims lost so much fluid that their skin turned bluish and wrinkled, and they could die within hours.
      Most doctors believed it was caused by miasma, poisonous air given off by rotting matter. It seemed to make sense. The poorest districts, where cholera struck hardest, were also the ones that stank the most.
      London in the 1850s stank a great deal. Human waste collected in cesspits under houses, overflowed into streets, and drained into the River Thames, the same river that much of the city drank from.
