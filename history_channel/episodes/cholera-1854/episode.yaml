  - id: rejected
    chapter: "VIII. Ignored"
    narration: >
      You might expect the authorities to have celebrated Snow. They did not.
      London's leading medical officer, John Simon, called Snow's theory peculiar. The official Board of Health report put the outbreak down to bad air. The Board's own scientists even saw tiny organisms, which they called vibriones, in water samples, but none of them suspected that these could be the cause. Many experts found the idea that people were drinking each other's waste simply too disgusting to accept.
      Another clue was missed entirely. That same year, in Italy, the anatomist Filippo Pacini looked at the intestines of cholera victims under a microscope and described the comma-shaped bacterium that causes the disease. His work went almost unnoticed for decades. Pacini died nearly penniless in 1883. Only in 1965 was the bacterium officially named in his honour: Vibrio cholerae Pacini 1854.
      Meanwhile the Thames got worse. In 1855, the scientist Michael Faraday took a boat trip on the river, dropped pieces of white card into the water, and watched them vanish from sight almost at once. He wrote to The Times that the whole river was, for the time, a real sewer.
    quote:
      text: "The whole river was for the time a real sewer."
      source: "Michael Faraday, letter to The Times, July 1855"
      match: "whole river was, for the time"
