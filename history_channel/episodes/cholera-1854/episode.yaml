  - id: snow
    chapter: "II. Dr Snow"
    narration: >
      John Snow was born in York in 1813, the first of nine children. His father was a labourer in a coal yard, in one of the poorest parts of the city. At fourteen, Snow was apprenticed to a surgeon near Newcastle, and in 1832, still a teenager, he met cholera for the first time, treating the sick in the coal-mining village of Killingworth. He became a vegetarian and a teetotaller, and he drank only water that had been boiled. He worked his way up to become one of the leading doctors in London.
      He was best known for something else entirely: anaesthesia. Snow was an expert in ether and chloroform, and on the seventh of April 1853 he gave chloroform to Queen Victoria during the birth of her son, Prince Leopold. Four years later, she asked for him again, for the birth of Princess Beatrice.
      But he had also been thinking hard about cholera. The disease attacked the gut, not the lungs. To Snow, that suggested it was swallowed, not breathed in.
      In 1849, he published a short essay arguing that cholera spread through contaminated water. Almost nobody was convinced. He needed proof.
