  - id: closing
    chapter: "Epilogue"
    narration: >
      Today, John Snow is considered one of the founders of epidemiology, the science of tracking how diseases spread. His method is still taught to every new generation of public health students: find the cases, map them, and pay attention to the exceptions.
      Cholera has not gone away. It still infects an estimated three to five million people a year and kills tens of thousands, almost always where people lack clean water and sanitation. On what is now Broadwick Street in Soho, a replica of the pump, without a handle, was put up near the original site in 1992. The spot where the real pump stood is marked by a red granite stone, beside a pub named after John Snow.
      If you enjoyed this story from the archives, subscribe for more forgotten chapters of medical history.
