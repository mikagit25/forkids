  - id: stink
    chapter: "IX. The Great Stink"
    date: "Summer 1858"
    narration: >
      In June 1858, London baked in a heatwave. The level of the Thames dropped, and the sewage that normally flowed away was left rotting on its banks in the sun.
      The smell became unbearable. It was so bad that inside the Houses of Parliament, beside the river, curtains were soaked in chloride of lime in an attempt to block it out. Members even discussed moving Parliament out of London. A newspaper reported that Benjamin Disraeli, the future prime minister, hurried out of a committee room with a mass of papers in one hand and his handkerchief pressed to his nose. He called the Thames a Stygian pool, reeking with ineffable and intolerable horrors. As The Times put it, Parliament was all but compelled to act by the force of sheer stench.
      The newspapers called it the Great Stink.
      John Snow did not live to see what happened next. On the tenth of June he suffered a stroke while working, and six days later he died, at the age of forty-five. The medical journal The Lancet gave him a short obituary that praised his work on chloroform, and said nothing about cholera. In 2013, a hundred and fifty-five years later, it published a correction.
