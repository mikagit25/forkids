- id: boats
  chapter: Chapter 4
  title: Women and Children
  narration: 'Shortly after midnight, Captain Smith ordered the lifeboats uncovered and the passengers woken. Then came the order: put the women and children in and lower away. At first, few people wanted
    to leave a huge, warm, brightly lit ship for a small open boat on a black sea. At a quarter to one, the first boat, number seven, was lowered with only twenty eight people on board. It could hold sixty
    five. The two officers in charge read the order differently. On the port side, Second Officer Charles Lightoller let in women and children only, and lowered boats with empty seats. On the starboard
    side, Murdoch let men in when no more women were waiting. Among those in boat number six was Margaret Brown, a wealthy woman from Denver. After the ship sank, she and others urged the quartermaster
    in charge to go back for people in the water. He refused. History remembers her as the Unsinkable Molly Brown. From the bridge, white distress rockets went up into the sky, one every few minutes. Eight
    in all.

    '
