- id: inquiry
  chapter: Chapter 7
  title: Questions
  narration: 'The day after the Carpathia arrived, the United States Senate began an inquiry, led by Senator William Alden Smith. The first hearings were held in the Waldorf Astoria hotel in New York. More
    than eighty witnesses were questioned: survivors, officers, wireless operators, captains of other ships. Fleet, the lookout, told the senators that with binoculars they would have seen the iceberg in
    time. A British inquiry followed. Both asked the same questions. Why so few lifeboats? Why was the ship going so fast through an ice field? Why did the Californian not come? Captain Rostron became a
    hero. Congress awarded him a gold medal, and survivors, among them Margaret Brown, gave him a silver cup.

    '
