- id: rescue
  title: Dawn
  narration: 'The Carpathia reached the place about an hour and a half after the Titanic had sunk. As the sky grew light, her crew saw the lifeboats scattered across the sea, and icebergs all around them.
    One by one, the boats came alongside, and the survivors climbed up rope ladders. They were given blankets and coffee, and the Carpathia''s own passengers gave them warm food and their own cabins. By
    a quarter past nine in the morning, the last boat had been emptied. Seven hundred and ten people were saved. A passenger on the Carpathia photographed an iceberg nearby. People said it was the one.
    Nobody will ever know for sure. Then Captain Rostron turned his ship for New York.

    '
