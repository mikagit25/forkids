- id: halifax
  title: Halifax
  narration: 'From Halifax in Canada, the White Star Line chartered a cable ship, the Mackay-Bennett, to recover the dead. She sailed with an undertaker, embalmers, one hundred and twenty five coffins and
    ice. Her crew found so many bodies that the embalming supplies ran out. One hundred and sixteen were buried at sea. One hundred and fifty victims lie in three cemeteries in Halifax. One hundred and
    twenty one of them are in Fairview Lawn Cemetery, in long curved rows of grey stones. A third of them were never identified, and their stones carry only a number and the date, April fifteenth, 1912.

    '
