- id: lifeboats
  title: Twenty Boats
  narration: 'There was one number that almost nobody thought about. The Titanic carried twenty lifeboats: fourteen large wooden boats, two smaller emergency cutters and four collapsible boats with canvas
    sides. Together, they could hold one thousand one hundred and seventy eight people. That was barely half of the people on board, and only about a third of the number the ship was allowed to carry. It
    was entirely legal. The British rules on lifeboats had been written in 1894, for ships of ten thousand tons and more. Nobody had imagined a ship of more than forty six thousand. The Titanic actually
    carried four more boats than the law required. And many people believed that on a ship like this, lifeboats would only be needed to ferry passengers to a rescue ship. The real lifeboat, they thought,
    was the ship herself.

    '
