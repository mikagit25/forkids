- id: iceberg
  title: Iceberg, Right Ahead
  narration: 'Up in the crow''s nest, twenty nine metres above the deck, the lookouts Frederick Fleet and Reginald Lee were peering into the dark. They had no binoculars. A pair had been left behind in
    Southampton, and their requests for another had come to nothing. There was no moon, and the sea was as flat as glass. Without waves, there was no white water breaking at the foot of an iceberg to give
    it away. At twenty one minutes to midnight, Fleet saw a dark shape ahead. He rang the bell and telephoned the bridge. First Officer William Murdoch ordered the helm hard over and the engines stopped.
    The bow swung slowly to the left. For a moment it seemed they had missed it. But the iceberg scraped along the starboard side, below the waterline, for about ninety metres. Many passengers hardly felt
    it. Some went up on deck and found pieces of ice lying on the forward well deck. A few of them kicked the ice around like footballs.

    '
