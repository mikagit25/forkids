- id: cold-open
  montage: true
  narration: 'At twenty to midnight on Sunday the fourteenth of April 1912, a lookout high above the deck of the largest ship in the world rang the bell three times and picked up the telephone. Iceberg,
    right ahead, he said. Less than three hours later, the ship was gone. Of the two thousand two hundred people on board, around fifteen hundred died in the freezing water of the North Atlantic. The ship
    was the Titanic. Her name has become a byword for disaster. But behind the legend there are real people, real decisions and real photographs, taken by the newspapers of 1912. This is the story of the
    Titanic, told with the pictures of the time.

    '
