- id: doomed
  title: Two Hours
  narration: 'Captain Smith came to the bridge at once and sent for Thomas Andrews, the ship''s designer, who was on board with a team from the shipyard. Together they went below. The mail room was flooding.
    So were the forward holds and the squash court. Andrews made his calculation quickly. Water was pouring into the first five compartments. The ship could survive with four flooded, but not with five.
    As the bow went down, the water would spill over the top of each bulkhead into the next, like water filling an ice cube tray. The Titanic was going to sink, and Andrews told the captain she had perhaps
    an hour and a half, two hours at most. Smith knew the numbers better than anyone. There were more than two thousand people on board, and lifeboats for about eleven hundred.

    '
