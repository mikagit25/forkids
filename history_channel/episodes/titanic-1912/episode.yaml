- id: departure
  chapter: Chapter 2
  title: The Maiden Voyage
  narration: 'The maiden voyage began on Wednesday the tenth of April 1912, at Southampton. Special trains brought passengers from London. As the Titanic left her berth, the suction from her huge propellers
    pulled a smaller liner, the New York, away from her moorings. Only a quick order from Captain Smith and a tugboat avoided a collision. It was a bad omen, people said afterwards. That evening, the Titanic
    called at Cherbourg in France. The harbour was too small for her, so passengers were brought out by two small tenders, the Traffic and the Nomadic. The Nomadic still exists today. The next day she stopped
    off Queenstown in Ireland, today called Cobh, and took on one hundred and twenty three more passengers, most of them emigrants in third class. When she turned west into the Atlantic, the Titanic carried
    about two thousand two hundred people: thirteen hundred passengers and almost nine hundred crew.

    '
