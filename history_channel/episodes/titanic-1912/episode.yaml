- id: news
  chapter: Chapter 6
  title: Waiting for News
  narration: 'On land, nobody knew what had really happened. The first reports were confused. Some newspapers even reported that the ship and everyone on board were safe. In New York, crowds gathered outside
    the White Star Line office on lower Broadway, waiting for lists of names. The Carpathia sailed through fog and thunderstorms for three days. On board, the injured Harold Bride, with frostbitten feet,
    helped her operator send the list of survivors. On the evening of the eighteenth of April, in heavy rain, she reached Pier 54 in New York. Some forty thousand people were waiting. Bride was carried
    down the gangway, his feet bandaged. He sold his story to the New York Times for a thousand dollars.

    '
