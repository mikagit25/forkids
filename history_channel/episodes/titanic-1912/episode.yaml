- id: shipyard
  chapter: Chapter 1
  title: Hull Number 401
  narration: 'The Titanic was born in Belfast, in the shipyard of Harland and Wolff. In 1907, the White Star Line decided to build three giant ships to win the Atlantic trade from its great rival, Cunard.
    The first, the Olympic, was simply called Number 400, the shipyard''s four hundredth hull. The second, Number 401, became the Titanic. The design was overseen by Lord Pirrie, the chairman of the yard,
    and by the naval architect Thomas Andrews. The two sisters were built side by side under a huge iron gantry. They were almost one and a half times the tonnage of Cunard''s fastest ships, the Lusitania
    and the Mauretania, and nearly thirty metres longer. The Titanic was two hundred and sixty nine metres long. Her hull was divided into compartments, so that she could stay afloat with up to four of
    them flooded. At a quarter past twelve on the thirty first of May 1911, the empty hull slid down the slipway into the River Lagan. About one hundred thousand people came to watch. It took another ten
    months to fit her out.

    '
