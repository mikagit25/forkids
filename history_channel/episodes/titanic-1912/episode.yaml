- id: closing
  chapter: Epilogue
  narration: 'The Titanic changed the rules of the sea. In 1914, the first International Convention for the Safety of Life at Sea required lifeboats for everyone on board and a wireless watch around the
    clock. The same year, the International Ice Patrol began to watch the North Atlantic for icebergs. It still does today. In 1985, a French and American expedition led by Jean-Louis Michel and Robert
    Ballard found the wreck, three thousand eight hundred metres down, in two main pieces six hundred metres apart. It is now protected as an underwater cultural heritage site. In New York, a memorial tablet
    was unveiled at the Seamen''s Institute. In Belfast, in Southampton, in Colne and in Halifax, people still remember. If you enjoyed this story from the archives, subscribe for more.

    '
