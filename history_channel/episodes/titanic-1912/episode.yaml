- id: orphans
  title: The Titanic Orphans
  narration: 'Among the survivors were two little boys who could not tell anyone who they were. The man who had brought them to a lifeboat had travelled as Louis Hoffman. His real name was Michel Navratil,
    a tailor, and he had taken his sons away from their mother, from whom he was separated, to start again in America. He did not survive. Newspapers around the world printed photographs of the children,
    who became known as the Titanic orphans. Weeks later, their mother recognised them in the pictures, and the boys went home to her. The elder boy, Michel, lived a long life. He was the last living male
    survivor of the Titanic.

    '
