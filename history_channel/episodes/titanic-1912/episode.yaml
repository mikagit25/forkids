- id: wireless
  title: CQD, SOS
  narration: 'In the wireless room, Jack Phillips began to send the distress call CQD, with the ship''s position. Harold Bride ran messages to the captain. At one point, Bride joked: send SOS, it''s the
    new call, and it may be your last chance to send it. Several ships answered. The closest one that heard the call was the Cunard liner Carpathia, ninety three kilometres away. Her wireless operator,
    Harold Cottam, ran to wake the captain. Her captain, Arthur Rostron, turned at once. He had the heating and the hot water switched off, so that every bit of steam went to the engines, and pushed his
    ship to seventeen and a half knots. He posted extra lookouts, had blankets, ladders and mail sacks put at every gangway door, and had three doctors wait in the dining rooms. Much closer, near enough
    to see, the Californian lay stopped in the ice. Her officers saw rockets in the night. But her only wireless operator was asleep, and the set was switched off.

    '
