- id: sinking
  chapter: Chapter 5
  title: Two Twenty
  narration: 'By two o''clock in the morning, all the regular lifeboats had gone. The bow was under water. Some fifteen hundred people were still on board. On deck, the ship''s band, led by the violinist
    Wallace Hartley from Colne in Lancashire, kept playing to keep people calm. Legend says the last piece was the hymn Nearer, My God, to Thee. Some survivors remembered only cheerful tunes. None of the
    eight musicians survived. Thomas Andrews was last seen in the first class smoking room, standing alone, his lifebelt lying on a table beside him. Phillips stayed at his key until the power failed. Then
    the stern rose high into the air, the lights went out, and the ship broke in two. At twenty past two, the Titanic disappeared. The water was minus two degrees. Officer Lightoller, who survived on an
    upturned collapsible boat with Harold Bride, said it felt like a thousand knives. Of the hundreds of people in the water, only about forty were pulled into the boats.

    '
