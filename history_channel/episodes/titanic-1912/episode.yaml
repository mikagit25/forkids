- id: luxury
  title: A Floating Palace
  narration: 'When she was finished, the Titanic was the largest ship afloat. She had ten decks, eight of them for passengers. First class had a grand staircase under a dome of iron and glass, a swimming
    pool, a gymnasium, Turkish baths, a squash court, a restaurant and a café with palms and wicker chairs, made to look like a sunny veranda. Some of the wealthiest people in the world travelled in first
    class. And in third class there were hundreds of emigrants from the British Isles, Scandinavia and all over Europe, going to start a new life in America. A third class ticket from Southampton cost seven
    pounds and five shillings. The cheapest first class ticket cost twenty three pounds. The best suites cost far more. In command was Captain Edward Smith, one of the most experienced captains in the world.
    He had joined the White Star Line in 1880, and he had already taken the Olympic on her first voyage.

    '
