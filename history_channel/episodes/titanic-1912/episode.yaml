- id: warnings
  chapter: Chapter 3
  title: Ice Warnings
  narration: 'The first days of the voyage passed quietly. The weather was calm and clear, and the ship was making good speed. On Sunday the fourteenth, the Titanic''s wireless room received warning after
    warning from other ships. The wireless was not run by the White Star Line, but by the Marconi Company. Its two young operators, Jack Phillips and Harold Bride, were paid mainly to send private telegrams
    for the passengers. The set had broken down the day before, and Phillips was working through a long backlog of messages to the station at Cape Race in Newfoundland. At eight minutes to ten that night,
    the steamer Mesaba reported heavy pack ice and a great number of large icebergs, right in the Titanic''s path. It is not clear that this message ever reached the bridge. Shortly after ten, the operator
    of the nearby Californian called: Say, old man, we are stopped and surrounded by ice. Phillips, busy with Cape Race, told him to stop transmitting. At half past eleven, the Californian''s only operator
    switched off his set and went to bed.

    '
