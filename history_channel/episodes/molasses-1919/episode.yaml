  - id: noon
    chapter: "IV. 12:30 p.m."
    date: "15 January 1919"
    narration: >
      The fifteenth of January 1919 was unusually mild. The day before, it had been bitterly cold. Now the temperature rose to around forty degrees Fahrenheit.
      At about half past twelve, as dock workers ate lunch and children played outside, people nearby heard a deep rumble, followed by sharp cracks, like a machine gun. Others said it felt like the ground was shaking, or that it sounded like a passing elevated train. Rivets were shooting out of the tank's steel plates.
      Then the tank split open.
      Millions of gallons of molasses burst out in a single wave, around twenty-five feet high at its peak, rushing through the streets at an estimated thirty-five miles an hour.
