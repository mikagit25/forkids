  - id: wave
    chapter: "V. The Wave"
    narration: >
      The wave smashed through everything in its path.
      Steel panels from the tank hurtled into the girders of the elevated railway, nearly bringing the tracks down. A streetcar was pushed off its rails. Buildings were knocked from their foundations and crushed. Several blocks were flooded two to three feet deep in molasses. A truck was picked up and thrown into the harbour. The Boston Globe reported that people were picked up by a rush of air and hurled many feet.
      People and horses were caught in the flood. Molasses is heavy and thick. Once it engulfed someone, they could barely move or breathe.
      A newspaper, the Boston Post, described the scene: horses died like so many flies on sticky fly-paper; the more they struggled, the deeper in the mess they were ensnared.
      The first rescuers were a hundred and sixteen cadets from the USS Nantucket, a training ship of the Massachusetts Nautical School, docked nearby. They ran several blocks and waded into the molasses, pulling out anyone they could reach. Then came police, soldiers, sailors and the Red Cross. Some Red Cross nurses waded into the molasses themselves. Doctors set up a makeshift hospital in a nearby building, and many people worked through the night.
      Twenty-one people died. Many were labourers and residents of the neighbourhood. Some of the youngest victims were children who had been playing nearby. About a hundred and fifty more were injured, and for days afterwards coughing fits were among the most common complaints. Dogs and horses were among the wounded too.
