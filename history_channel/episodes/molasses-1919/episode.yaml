  - id: trial
    chapter: "IX. The Trial"
    date: "1919–1925"
    narration: >
      The company had a ready explanation. It claimed that anarchists had blown up the tank. In 1919, America was gripped by fear of anarchist bombings, and the story was not as absurd as it sounds today.
      Later that same year, followers of the Italian anarchist Luigi Galleani mailed dozens of bombs to politicians and officials, and on the second of June 1919 they set off nine large bombs almost at once in eight American cities. One of them wrecked the front of the Attorney General's house in Washington. In September, even Boston's police went on strike, and the city went through nights of riots. The governor who stood firm against the strikers, Calvin Coolidge, became famous across the country for it, and a few years later he was President of the United States. In that atmosphere, a bomb sounded believable.
      But the families did not accept it. One hundred and nineteen residents and businesses joined together in one of the first class-action lawsuits in Massachusetts.
      For about three years, a court-appointed auditor, Hugh Ogden, heard testimony from engineers, workers and witnesses. In the end, he found that the tank had simply been too weak for its load, built without proper calculation and never properly tested.
      He rejected the company's bomb story. United States Industrial Alcohol was held responsible. It paid around six hundred and twenty-eight thousand dollars in damages, roughly seven thousand dollars for each victim's family.
