  - id: cleanup
    chapter: "VIII. Cleaning Up a Sea of Syrup"
    narration: >
      The cleanup took weeks. Fresh water barely shifted the sticky mass, so crews sprayed it with salt water from a fireboat, and spread sand to soak it up. Several hundred people joined the work.
      Rescuers, workers and sightseers tracked it across the city: onto subway platforms, the seats of trains and streetcars, pay telephones and into homes. As one account put it, everything a Bostonian touched was sticky. The harbour stayed brown until the summer.
      And for decades afterwards, North End residents said that on hot summer days, the neighbourhood still smelled faintly of molasses.
