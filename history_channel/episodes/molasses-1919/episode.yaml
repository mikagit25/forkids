  fr:
    title: "La grande inondation de mélasse : la catastrophe la plus étrange de Boston"
    subtitle: "Une vague de sirop, 21 morts et le procès qui a changé la façon de construire en Amérique"
    summary: >
      Le 15 janvier 1919, une immense cuve d'acier du port de Boston s'est fendue et a libéré plus de deux millions de
      gallons de mélasse. Une vague d'environ huit mètres de haut a déferlé sur le quartier populaire du North End, tordu
      les poutres du métro aérien, renversé des bâtiments et tué vingt et une personnes, dont deux enfants de dix ans.
      Voici l'histoire de la grande inondation de mélasse : une cuve construite à la hâte et peinte en brun pour cacher
      ses fuites, la course contre la Prohibition, les cadets qui se sont jetés dans la mélasse pour secourir les
      victimes, l'entreprise qui accusa les anarchistes l'année des attentats et de la grève de la police, et la
      procédure de trois ans qui a changé la façon de construire en Amérique.
