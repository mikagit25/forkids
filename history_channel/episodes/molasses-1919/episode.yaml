  - id: warnings
    chapter: "III. The Leaking Tank"
    narration: >
      The tank had been built in 1915, in a hurry. The man in charge of its construction was the company's treasurer, Arthur Jell. He had no training as an engineer or architect. The tank was never properly tested with water to check for leaks before the molasses went in.
      From its very first filling, it leaked. Brown streaks ran down its sides. The company's response was to paint the tank brown, so the leaks would not show.
      Local families came with buckets and cans to collect the molasses that oozed out. Every time it was filled, people heard the tank groan and rumble. Nobody stopped it. In more than three years, it had been filled to the top only eight times, so its walls were stretched and relaxed again and again. Some engineers also think that the molasses inside was slowly fermenting, giving off gas that raised the pressure, and that the final crack began near a manhole cover at the base of the tank.
    candidates: ["riveted steel tank", "storage tank 1915", "oil tank construction 1915"]
