  - id: legacy
    chapter: "Epilogue"
    narration: >
      The verdict changed the rules. Massachusetts, and then states across the country, began requiring that large structures be designed and approved by licensed engineers and architects, with their calculations on file.
      Today, a small plaque on Commercial Street marks the spot. The tank is long gone, and a park stands nearby.
      It is easy to laugh at the idea of a molasses flood. But the people of the North End paid for it with their lives, and every building we trust today owes a little to what Boston learned that day.
      If you enjoyed this story from the archives, subscribe for more forgotten chapters of history.
    images:
