  de:
    title: "Die große Melasseflut: Bostons seltsamste Katastrophe"
    subtitle: "Eine Welle aus Sirup, 21 Tote und der Prozess, der Amerikas Bauregeln veränderte"
    summary: >
      Am 15. Januar 1919 riss im Hafen von Boston ein riesiger Stahltank auf und setzte mehr als zwei Millionen Gallonen
      Melasse frei. Eine etwa acht Meter hohe Welle wälzte sich durch das dicht bewohnte Viertel North End, verbog die
      Träger der Hochbahn, warf Gebäude um und tötete einundzwanzig Menschen, darunter zwei zehnjährige Kinder. Dies ist
      die Geschichte der großen Melasseflut: ein in Eile gebauter Tank, braun gestrichen, damit man seine Lecks nicht sah,
      das Wettrennen gegen die Prohibition, die Kadetten, die in die Melasse wateten, um Eingeschlossene zu retten, die
      Firma, die im Jahr der Bombenanschläge und des Polizeistreiks Anarchisten beschuldigte, und das dreijährige
      Verfahren, das veränderte, wie Amerika baut.
