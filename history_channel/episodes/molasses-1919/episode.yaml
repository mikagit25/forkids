    subtitle: "Una ola de jarabe, 21 muertos y el juicio que cambió la forma de construir en Estados Unidos"
    summary: >
      El 15 de enero de 1919, un enorme tanque de acero en el puerto de Boston se partió y liberó más de dos millones de
      galones de melaza. Una ola de unos ocho metros de altura recorrió el populoso barrio del North End, dobló las vigas
      del ferrocarril elevado, derribó edificios y mató a veintiuna personas, entre ellas dos niños de diez años. Esta es
      la historia de la gran inundación de melaza: un tanque construido con prisa y pintado de marrón para ocultar sus
      fugas, la carrera contra la Ley Seca, los cadetes que entraron en la melaza para rescatar a los atrapados, la
      empresa que culpó a los anarquistas en el año de las bombas y de la huelga policial, y el proceso de tres años que
      cambió la forma de construir en Estados Unidos.
