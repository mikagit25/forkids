  - id: legacy
    chapter: "Epilogue"
    narration: >
      The case is considered a milestone in the development of modern corporate regulation. The verdict changed the rules. Massachusetts, and then states across the country, began requiring that large structures be designed and approved by licensed engineers and architects, with their calculations on file.
      The tank was never rebuilt. The site became a yard for the elevated railway, and today it is a city park, Langone Park, with a baseball field, a playground and bocce courts. A small plaque at the entrance to the neighbouring park marks the disaster. It speaks of a forty-foot wave; most modern estimates are closer to twenty-five feet. Much of what we know about the victims comes from the historian Stephen Puleo, who pieced together their stories in his 2004 book, Dark Tide.
      On the fifteenth of January 2019, a hundred years to the day, people gathered there. Ground-penetrating radar had found the tank's concrete base, still buried about half a metre under the baseball field. They stood in a circle marking the edge of the tank, and the names of the twenty-one people who died were read aloud.
      It is easy to laugh at the idea of a molasses flood. But the people of the North End paid for it with their lives, and every building we trust today owes a little to what Boston learned that day.
      If you enjoyed this story from the archives, subscribe for more forgotten chapters of history.
