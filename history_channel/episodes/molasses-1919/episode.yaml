  - id: why
    chapter: "II. Why Molasses?"
    narration: >
      Molasses had been part of New England's trade for two centuries. Ships carried it north from the sugar plantations of the Caribbean, where it was distilled into rum — part of the same Atlantic trade that carried enslaved Africans across the ocean. But by 1919, molasses was not just for baking or rum. It could be fermented and distilled into industrial alcohol, a key ingredient in making munitions.
      During the First World War, demand had soared. Ships from the Caribbean unloaded molasses into the Boston tank, and from there it went by pipeline to the company's alcohol plant in nearby Cambridge.
      The war had ended with the armistice of the eleventh of November 1918, and by early 1919 the fighting was over, but another deadline was approaching. The country was about to adopt Prohibition, which would ban the production of alcoholic drinks. Some historians believe the company was hurrying to turn as much molasses as possible into alcohol before the law took effect.
      Just the day before the disaster, a ship had delivered a fresh load, warmed so that it would flow more easily into the tank.
      The timing was remarkable. The day after the disaster, on the sixteenth of January 1919, Nebraska became the thirty-sixth state to ratify the Eighteenth Amendment, and nationwide Prohibition became part of the Constitution. It took effect one year later.
