  - id: science
    chapter: "VII. Why It Was So Deadly"
    narration: >
      For decades, people wondered how a liquid used in cookies could kill. Molasses is about forty per cent denser than water, so a tank full of it held an enormous amount of energy. And it behaves strangely: under pressure it thins and flows fast, then it slows and thickens again.
      In 2016, a team of scientists and students at Harvard modelled the disaster. They gathered 1919 newspaper reports, old maps and weather records, and flooded a scale model of the neighbourhood with cold corn syrup. They concluded that the reports of the wave's terrible speed were believable. They found that the cold made all the difference. As the magazine Scientific American put it, a wave of molasses is even more devastating than a typical tsunami: it moves fast enough to sweep people up and demolish buildings, then settles into a gelatinous state that keeps them trapped.
      As the molasses spread out into the freezing January air, it cooled quickly and became even thicker. Victims caught in it found themselves trapped, as if in quicksand that was slowly setting around them. That also made the rescue painfully slow.
      It took days to find all the victims. The search went on for four days. Some victims had been swept into the harbour, and were not found until three or four months later.
      Engineers have studied the tank too. A modern analysis in 2014 found that its steel was only half as thick as it should have been, even by the standards of the time. The steel also lacked manganese, which made it brittle, and the first cracks appear to have formed around the rivet holes.
    candidates: ["molasses", "Harvard University 2016"]
