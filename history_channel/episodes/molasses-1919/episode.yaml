thumbnail:
  scene: wave
  big: "1919"
  small: "A WAVE OF MOLASSES HIT BOSTON"
tags: ["Great Molasses Flood", "Boston", "1919", "weird history", "disaster", "North End", "documentary"]
references:
  - "Wikipedia, Great Molasses Flood: https://en.wikipedia.org/wiki/Great_Molasses_Flood"

research:                # newspapers of the time: python run.py episodes/molasses-1919 research
  - {q: "molasses tank explosion Boston", from: 1919-01-15, to: 1919-02-28, sources: [chronam, nyt]}
  - {q: "molasses verdict", from: 1925-01-01, to: 1925-12-31, sources: [nyt]}

summary: >
  On 15 January 1919, a giant steel tank on Boston's waterfront split open and released more than two million gallons of
  molasses. A wave some twenty-five feet high rushed through the crowded North End, bent the girders of the elevated
  railway, flattened buildings and killed twenty-one people, among them two ten-year-old children. This is the story of
  the Great Molasses Flood: a tank built in a hurry and painted brown to hide its leaks, the race to beat Prohibition,
  the cadets who waded in to rescue the trapped, the company that blamed anarchists in the year of the bombings and the
  police strike, and the three-year hearing that changed how America builds.

