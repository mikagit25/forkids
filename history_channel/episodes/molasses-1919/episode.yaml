  - id: victims
    chapter: "VI. The Victims"
    narration: >
      The dead came from every part of the neighbourhood's life.
      Six of them worked at the city's paving yard beside the tank: labourers, a paver and two blacksmiths. There were teamsters and drivers with their wagons, a longshoreman, an expressman and a messenger. George Layhe, a firefighter of Engine 31, died when the wave smashed into his firehouse. In a house nearby, sixty-five-year-old Bridget Clougherty was killed when her home was flattened, and Stephen Clougherty, thirty-four, died too. The oldest victim, Michael Sinnott, was seventy-eight. Two of the teamsters, Eric Laird and Peter Shaughnessy, were only seventeen and eighteen.
      The youngest were two ten-year-olds, Pasquale Iantosca and Maria Di Stasio. Several other children were caught as they played or walked home for lunch.
      One boy, Anthony di Stasio, was walking home from school with his sisters when the wave picked him up and carried him on its crest, almost as if he were surfing. Then it rolled him like a pebble. He heard his mother calling his name, but his throat was so full of molasses that he could not answer. He passed out, and woke to find three of his four sisters looking down at him. Anthony survived. The fourth, ten-year-old Maria, did not.
      Many of the families were immigrants who had come to Boston for work and a better life. Many of the families were immigrants who had come to Boston for work and a better life. A hundred years later, their twenty-one names would be read aloud on the spot where the tank had stood.
