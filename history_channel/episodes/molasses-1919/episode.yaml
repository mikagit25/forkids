  - id: north-end
    chapter: "I. The North End"
    date: "Boston, 1919"
    narration: >
      Boston's North End is the city's oldest neighbourhood, settled in the 1630s. It was the home of Paul Revere. By 1919 it was one of the most crowded neighbourhoods in America. Wave after wave of newcomers had settled here: first the Irish, then Jewish families from Eastern Europe, and then Italians. By 1910, Italian immigrants alone made up a quarter of all its residents, packed into tenements near the harbour.
      Along Commercial Street ran the docks, warehouses, a fire station and the Atlantic Avenue elevated railway, opened in 1901, carrying trains above the street on steel girders.
      And standing over it all was a giant steel tank, owned by the Purity Distilling Company, bought in 1917 by United States Industrial Alcohol.
      It was fifty feet tall and ninety feet across. It could hold about two point three million gallons of molasses, weighing some twelve thousand tonnes.
