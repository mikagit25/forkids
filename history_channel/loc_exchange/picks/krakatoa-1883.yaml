  title: "De Locomotief (Samarang), 27 Aug 1883: \"Uit Batavia, 27 Augustus\""
  date: "1883-08-27"
  note: "SAME-DAY report: \"yesterday and last night continuous dull bangs and rumbling were heard here, probably caused by the volcano on Krakatau; ash rain even in the upper town; the air was thick and hazy\""

