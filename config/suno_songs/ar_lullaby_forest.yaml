lyrics: |
  [Verse 1]
  الغابة هادية والأشجار تهمس
  العصافير نامت والقمر يلمس
  الأرنب الصغير في بيته نايم
  والدب الحلو بحضن أمه حايم

  [Chorus]
  نم في الغابة
  يا طفلي الحلو
  الأشجار تحرسك
  والقمر يضو

  [Verse 2]
  جرجر الجداول على الحجارة
  والنسيم يهدهد بكل لطارة
  زهور الليل تفوح بعطرها
  والغابة تغني لك بسرّها

  [Chorus]
  نم في الغابة
  يا طفلي الحلو
  الأشجار تحرسك
  والقمر يضو

  [Outro]
  نم يا طفلي... في أمان الغابة...
