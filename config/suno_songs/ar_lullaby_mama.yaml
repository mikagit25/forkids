lyrics: |
  [Verse 1]
  ماما تحضنك وتغني لك
  بحبها الكبير تهديلك
  عيونك الحلوة غمضيها شوي
  وبحضن ماما نامي يا روحي

  [Chorus]
  نامي يا حبيبتي
  يا نور عيوني
  ماما معاكي
  دايماً تحميكي

  [Verse 2]
  أيدي ماما دافية وحنونة
  بصوتها الناعم تهديكي يا حلوتنا
  الأحلام الحلوة رح تجيلك
  وماما تفضل جنبك تحبلك

  [Chorus]
  نامي يا حبيبتي
  يا نور عيوني
  ماما معاكي
  دايماً تحميكي

  [Outro]
  نامي يا قلبي... بحب ماما...
